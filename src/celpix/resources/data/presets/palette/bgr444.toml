# BGR444 — 12-bit: B=bits 8-11, G=4-7, R=0-3, top nibble unused. Common on
# arcade hardware; note the GBA's own palette is 15-bit BGR555, not this.
# Tools that list components from the low bits up spell this same layout
# "R4G4B4", so a name met elsewhere reads backwards against ours, which are
# MSB-first (docs/design/plugin-system.md §2). The id keeps that low-bits-up
# spelling: ids are stable, project files reference them.
# See docs/graphics-formats-reference/implementation-guide.md §4.
id = "preset.palette.bgr444"
name = "BGR444 (12-bit)"
engine_id = "codec.palette.mask"
category = "Generic"

[params]
bytes_per_entry = 2
byte_order = "little"
fields = ".... bbbb gggg rrrr"
