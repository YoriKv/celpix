# Big-endian variant of GRB333 (9-bit) — for big-endian palette data.
# The id keeps its historic spelling (see grb333.toml).
# See docs/graphics-formats-reference/implementation-guide.md §4.
id = "preset.palette.grb333-be"
name = "GRB333 (9-bit, nibble-spaced, big-endian)"
engine_id = "codec.palette.mask"
category = "Generic"

[params]
bytes_per_entry = 2
byte_order = "big"
fields = ".... .ggg .rrr .bbb"
