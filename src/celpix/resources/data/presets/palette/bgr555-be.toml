# Big-endian variant of the BGR555 layout — for palette data stored big-endian.
# The SNES CGRAM and GBC/GBA palette RAM are little-endian: that is the plain preset.
# See docs/graphics-formats-reference/implementation-guide.md §4 (packed color formats).
id = "preset.palette.bgr555-be"
name = "BGR555 (big-endian)"
engine_id = "codec.color-mask"

[params]
bytes_per_entry = 2
byte_order = "big"

[params.masks]
r = 0x001F
g = 0x03E0
b = 0x7C00
