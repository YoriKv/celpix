# 15-bit RGB with each channel's low bit parked at the bottom of the word:
# bits 15-4 are R4 G4 B4 in order, then bits 3/2/1 are the low bits of R/G/B and
# bit 0 is unused. Splitting a channel keeps the visible nibbles byte-aligned,
# which is why a lot of 68000 arcade video hardware stores colour this way
# (MAME calls the layout RRRRGGGGBBBBRGBx; NMK's 16-bit boards are one family).
# Big-endian only: the palette lives in 68000 RAM, so it is reached through a
# save state or a RAM dump, and those are big-endian words.
#
# The layout below is that name written out: each channel's two runs are one
# field, in the order they are read, so the high nibble comes first and the
# stray low bit second. See
# docs/graphics-formats-reference/implementation-guide.md §4.
id = "preset.palette.rgb555-split-be"
name = "RGB555 split low bits (15-bit, big-endian)"
engine_id = "codec.palette.mask"
category = "Generic"

[params]
bytes_per_entry = 2
byte_order = "big"
fields = "rrrr gggg bbbb rgb."
