# Big-endian variant of BGR444 (12-bit) — for big-endian palette data.
# The id keeps its historic spelling (see bgr444.toml).
# See docs/graphics-formats-reference/implementation-guide.md §4.
id = "preset.palette.bgr444-be"
name = "BGR444 (12-bit, big-endian)"
engine_id = "codec.palette.mask"

[params]
bytes_per_entry = 2
byte_order = "big"

[params.masks]
r = 0x000F
g = 0x00F0
b = 0x0F00
