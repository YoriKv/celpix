# RGBA8888 — one byte per component, file bytes R,G,B,A.
# Byte-aligned formats are named by their file byte sequence, which pins the
# format with no endianness qualifier (docs/design/plugin-system.md §2). The id
# keeps its historic spelling: ids are stable, project files reference them.
# See docs/graphics-formats-reference/implementation-guide.md §4.
id = "preset.palette.rgba8888"
name = "RGBA8888 (bytes R,G,B,A)"
engine_id = "codec.palette.mask"

[params]
bytes_per_entry = 4
byte_order = "little"

[params.masks]
a = 0xFF000000
r = 0x000000FF
g = 0x0000FF00
b = 0x00FF0000
