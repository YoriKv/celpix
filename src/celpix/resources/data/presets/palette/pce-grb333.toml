# PC Engine VCE — 9-bit GRB packed three bits to a component with no padding:
# G=bits 6-8, R=3-5, B=0-2, little-endian u16, top 7 bits unused.
#
# Not the same layout as `grb333`, which spaces the same three components a
# nibble apart. Both are "9-bit GRB" and they are not interchangeable — the
# console packs, the tile editor pads. See
# docs/graphics-formats-reference/tile-converter-formats.md §3.3.
id = "preset.palette.pce-grb333"
name = "GRB333 (9-bit, packed - PC Engine VCE)"
engine_id = "codec.palette.mask"
category = "NEC"

[params]
bytes_per_entry = 2
byte_order = "little"
fields = ".... ...g ggrr rbbb"
