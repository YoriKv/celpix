# PS2 Graphics Synthesizer CLUT entry (PSMCT32): file bytes R,G,B,A, the
# `rgba8888` layout, but the GS reads alpha as 0x00-0x80 with 0x80 = opaque.
# Read as plain 8-bit alpha, a 0x80 palette draws everything half transparent.
#
# `alpha_max` scales the whole alpha byte against 0x80, so the graded ramps fonts
# and soft sprites use (0x20, 0x40, ...) draw as the partial alpha they are and
# every value 0x00-0x80 saves back as itself. A stored alpha above 0x80 draws
# opaque and, once its entry is edited, saves as 0x80. The 16-bit CLUT format
# (PSMCT16) is `bgr555`, with bit 15 the alpha bit.
# See docs/graphics-formats-reference/implementation-guide.md §4.
id = "preset.palette.rgba8888-ps2"
name = "PS2 CLUT (RGBA8888, alpha 0x80)"
engine_id = "codec.palette.mask"
category = "Sony"

[params]
bytes_per_entry = 4
byte_order = "little"
fields = "aaaa aaaa bbbb bbbb gggg gggg rrrr rrrr"
alpha_max = 128
