# Alias of `genesis-9bpp-le` that files the layout under Generic too (its own
# entry names the machine). Same codec/params, a distinct id so both listings
# coexist — 9-bit BGR, little-endian u16, each component in bits 3-1 of its
# nibble: 0000 BBB0 GGG0 RRR0. See genesis-9bpp-le.toml for what puts data in
# this order.
id = "preset.palette.bgr333-le"
name = "BGR333 (9-bit, little-endian)"
engine_id = "codec.palette.mask"
category = "Generic"

[params]
bytes_per_entry = 2
byte_order = "little"
fields = ".... bbb. ggg. rrr."
