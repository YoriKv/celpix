# BGR555 — SNES CGRAM and GBC/GBA palette RAM: 0BBBBBGGGGGRRRRR, little-endian
# u16, bit 15 unused. (The PCE is not this family: its palette is 9-bit GRB.)
#
# A PlayStation CLUT is the same fifteen bits, but bit 15 there is the GPU's
# semi-transparency flag rather than spare. It decodes identically — the flag is
# not color — and the TIM container carries it over on save, since an ARGB
# palette has nowhere to keep it (docs/graphics-formats-reference/psx-tim-formats.md).
# Component masks are hex integers; omit a component (e.g. alpha) to leave it out.
# See docs/graphics-formats-reference/implementation-guide.md §4.
id = "preset.palette.bgr555"
name = "BGR555 (SNES/GBC/GBA/PSX)"
engine_id = "codec.palette.mask"

[params]
bytes_per_entry = 2
byte_order = "little"

[params.masks]
r = 0x001F
g = 0x03E0
b = 0x7C00
