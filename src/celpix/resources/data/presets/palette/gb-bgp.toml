# Game Boy `BGP` / `OBP` register — one byte holding a whole four-shade palette,
# two bits per entry from the low bits up, counting *darkness*: 0 is white and 3
# is black.
#
# A register rather than an array, which is why the entry is stated in bits: no
# single byte on disk is one shade wide. Reading four entries therefore reads one
# byte, and editing any one of them rewrites that byte
# (docs/design/palette-editing.md). The Game Boy Color's own palettes are not
# this — they are ordinary BGR555 colour, so use `bgr555` for those.
# See docs/graphics-formats-reference/tile-converter-formats.md §3.3.
id = "preset.palette.gb-bgp"
name = "Game Boy palette register (4 x 2-bit grey)"
engine_id = "codec.palette.mask"
category = "Nintendo"

[params]
bits_per_entry = 2
invert = true
gray = true

[params.masks]
r = 0x03
