# 3bpp planar, separate planes — 3 whole 8-byte planes one after another
# (NES-style). The peer layout is the per-row interleave: preset.pixel.3bpp-planar.
# See docs/graphics-formats-reference/implementation-guide.md §2 (planar plane-offset table).
id = "preset.pixel.3bpp-planar-separate"
name = "3bpp planar, separate planes (8x8, NES-style)"
engine_id = "codec.pixel.planar"

[params]
bpp = 3
planes = [
  { base = 0, stride = 1 },
  { base = 8, stride = 1 },
  { base = 16, stride = 1 },
]
