# 8bpp linear — one byte per pixel (SNES Mode 7, Nintendo DS 2D, generic 8bpp).
# "Linear" is the tile-editor term for it; hardware docs say "chunky", which is
# where this preset's id comes from.
#
# At 8bpp a packed field is a whole byte, so the pixel never shares one and the
# decode is a straight copy — the degenerate case of codec.packed rather than a
# format of its own.
# See docs/graphics-formats-reference/implementation-guide.md §2 (chunky).
id = "preset.pixel.chunky-8bpp"
name = "8bpp linear (Mode 7 / NDS, 8x8)"
engine_id = "codec.packed"

[params]
bpp = 8
tile_width = 8
tile_height = 8
