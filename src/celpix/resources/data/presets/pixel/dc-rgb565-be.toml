# Big-endian variant of RGB565 direct (8x8) — for big-endian ROM data (e.g. N64).
# See docs/graphics-formats-reference/implementation-guide.md §3 (direct-color tiles).
id = "preset.pixel.dc-rgb565-be"
name = "Direct RGB565 (big-endian)"
engine_id = "codec.pixel.direct-color"
category = "Direct color"

[params]
bytes_per_pixel = 2
byte_order = "big"
fields = "rrrr rggg gggb bbbb"
