# Atari System 2 motion objects (sprites) — 16x16 4bpp, two plane pairs.
# Same encoding as the playfield at four groups per row, so it also needs
# "Split bitplanes (2 ROMs, join)" selected under Reshape first. The sprite ROM
# region is stored inverted on this hardware; no shipped Reshape plugin inverts,
# so if the image looks like a negative the file has to be inverted before it is
# opened.
# See docs/graphics-formats-reference/mame-formats.md §3.2 and §3.3.
id = "preset.pixel.atari-sy2-sprites-4bpp"
name = "Atari System 2 sprites (16x16, 4bpp, split halves joined)"
engine_id = "codec.nibble-planar"

[params]
bpp = 4
tile_width = 16
tile_height = 16
