# Atari System 2 playfield tiles — 8x8 4bpp, two plane pairs.
# The pairs live in opposite halves of the graphics region, so select
# "Split bitplanes (2 ROMs, join)" under Reshape first; after that each
# 4-pixel group is two adjacent bytes (bits 3/2 then bits 1/0).
# See docs/graphics-formats-reference/mame-formats.md §3.2.
id = "preset.pixel.atari-sy2-tiles-4bpp"
name = "Atari System 2 playfield (8x8, 4bpp, split halves joined)"
engine_id = "codec.pixel.nibble-planar"
category = "Arcade"

[params]
bpp = 4
tile_width = 8
tile_height = 8
