# SNES / PC Engine 4bpp tiles — two interleaved plane-pairs, pairs 16 bytes apart.
# Matches *.4bpp.sfc sheets. Also the PC Engine VDC's own character format, listed
# a second time as `pce-4bpp` so it is findable under NEC.
# See docs/graphics-formats-reference/implementation-guide.md §2.
id = "preset.pixel.snes-4bpp"
name = "SNES 4bpp (8x8, same as PC Engine)"
engine_id = "codec.pixel.planar"
category = "Nintendo"

[params]
bpp = 4
planes = [
  { base = 0, stride = 2 },
  { base = 1, stride = 2 },
  { base = 16, stride = 2 },
  { base = 17, stride = 2 },
]
