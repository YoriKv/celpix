# Big-endian variant of RGB555 direct (8x8) — for big-endian ROM data (e.g. N64).
# See docs/graphics-formats-reference/implementation-guide.md §3 (direct-color tiles).
# 15 significant bits in a 2-byte pixel.
id = "preset.pixel.dc-rgb555-be"
name = "Direct RGB555 (big-endian)"
engine_id = "codec.pixel.direct-color"
category = "Direct color"

[params]
bytes_per_pixel = 2
byte_order = "big"
fields = ".rrr rrgg gggb bbbb"
