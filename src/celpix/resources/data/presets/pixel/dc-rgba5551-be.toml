# N64 RGBA16 — the N64 SDK's name for big-endian RGBA5551 direct color, the
# spelling N64 hackers use. Big-endian because N64 ROM data is stored that way;
# the little-endian dc-rgba5551 preset stays in the generic Direct matrix.
# See docs/graphics-formats-reference/implementation-guide.md §3 (direct-color tiles).
id = "preset.pixel.dc-rgba5551-be"
name = "N64 RGBA16 (5551, 8x8, big-endian)"
engine_id = "codec.direct-color"

[params]
bytes_per_pixel = 2
byte_order = "big"

[params.masks]
a = 0x0001
r = 0xF800
g = 0x07C0
b = 0x003E
