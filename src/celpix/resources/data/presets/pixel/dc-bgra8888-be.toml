# Big-endian variant of BGRA8888 direct (8x8) — for big-endian ROM data (e.g. N64).
# See docs/graphics-formats-reference/implementation-guide.md §3 (direct-color tiles).
id = "preset.pixel.dc-bgra8888-be"
name = "Direct BGRA8888 (big-endian)"
engine_id = "codec.pixel.direct-color"
category = "Direct color"

[params]
bytes_per_pixel = 4
byte_order = "big"
fields = "bbbb bbbb gggg gggg rrrr rrrr aaaa aaaa"
