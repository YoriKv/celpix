# IA16 intensity + alpha — two bytes per pixel, a full byte of grey then a full
# byte of alpha (N64 texture format IA, 16-bit). Big-endian, which is how N64 ROM
# data is stored. R/G/B share the intensity byte; see dc-i8 on why.
# See docs/graphics-formats-reference/mame-formats.md §4.3.
id = "preset.pixel.dc-ia16-be"
name = "N64 IA16 (intensity+alpha, 8x8, big-endian)"
engine_id = "codec.pixel.direct-color"
category = "Nintendo"

[params]
bytes_per_pixel = 2
byte_order = "big"

[params.masks]
a = 0x00FF
r = 0xFF00
g = 0xFF00
b = 0xFF00
