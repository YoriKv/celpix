# Big-endian variant of RGBA8888 direct (8x8) — for big-endian ROM data (e.g. N64).
# See docs/graphics-formats-reference/implementation-guide.md §3 (direct-color tiles).
id = "preset.pixel.dc-rgba8888-be"
name = "Direct RGBA8888 (8x8, big-endian)"
engine_id = "codec.pixel.direct-color"
category = "Direct color"

[params]
bytes_per_pixel = 4
byte_order = "big"
fields = "rrrr rrrr gggg gggg bbbb bbbb aaaa aaaa"
