# Big-endian variant of BGR888 direct (8x8) — for big-endian ROM data (e.g. N64).
# See docs/graphics-formats-reference/implementation-guide.md §3 (direct-color tiles).
id = "preset.pixel.dc-bgr888-be"
name = "Direct BGR888 (8x8, big-endian)"
engine_id = "codec.pixel.direct-color"
category = "Direct color"

[params]
bytes_per_pixel = 3
byte_order = "big"

[params.masks]
r = 0x0000FF
g = 0x00FF00
b = 0xFF0000
