# Direct-color RGBA5551 direct (8x8) — DC catalogue (§3). The N64's own
# texture format is the big-endian variant; this is the generic little-endian one.
# See docs/graphics-formats-reference/implementation-guide.md §3 (direct-color tiles).
id = "preset.pixel.dc-rgba5551"
name = "Direct RGBA5551 (8x8)"
engine_id = "codec.direct-color"

[params]
bytes_per_pixel = 2
byte_order = "little"

[params.masks]
a = 0x0001
r = 0xF800
g = 0x07C0
b = 0x003E
