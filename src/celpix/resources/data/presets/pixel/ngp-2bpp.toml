# Neo Geo Pocket 2bpp, **non-swapped** — pixel 0 in the high 2 bits, and byte 0
# of a row drives its left 4 pixels. This is the minority reading — one editor in
# hand orders the row this way, against two others that put the odd byte on the
# left. Reach for `ngp-2bpp-swapped` first and fall back here if the
# art comes out with each group of four pixels transposed.
#
# The plain id is this one for historical reasons — a preset id is what saved
# projects store, so neither can be renamed to match which is now preferred.
# See docs/graphics-formats-reference/implementation-guide.md §2 (packed / linear).
id = "preset.pixel.ngp-2bpp"
name = "Neo Geo Pocket 2bpp, byte 0 left (8x8)"
engine_id = "codec.pixel.packed"
category = "SNK"

[params]
bpp = 2
msb_first = true
