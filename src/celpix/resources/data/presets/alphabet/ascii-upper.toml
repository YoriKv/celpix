# Uppercase letters, digits and a little punctuation numbered from 0 — the
# arrangement a font sheet drawn for a machine with no lower case falls into,
# and the one to try first on a text run whose font is unknown.
#
# `first = 0` is a starting guess and nothing more. Where a run begins is in the
# game's code, not in the art, so no table can know it — which is why it is a
# control and not a preset: leave this one picked and dial **Base code** on the
# tilemap bar against the text window until the words appear. The symptom of
# having it wrong is unmistakable, and is the whole reason this preset is worth
# trying blind: the text comes out as *near-words* — right word lengths, right
# rhythm, consistently wrong letters — which says the shape of the alphabet is
# already right and only its origin is off.
#
# Base tile is that control's twin one reading over. It shifts what the cells
# *draw*, so it is the one to reach for when the **picture** is near-words and
# the text is fine (docs/graphics-formats-reference/text-formats.md sec 3.2).
#
# It states no controls at all: a bare index-only text run has no punctuation
# to declare, and where a stream does have a terminator or a line break those
# belong to the *stream's* cell format, not to the font
# (docs/design/fontmap-entry.md sec 3).
id = "alphabet.ascii-upper"
name = "A-Z 0-9, from 0"
engine_id = "alphabet.table"

[params]
first = 0
chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,'!?-"
