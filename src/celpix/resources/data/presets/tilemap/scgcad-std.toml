# Converted screen (STD) cell — one byte, character number only.
#
# The converter that writes these keeps the low byte of each screen cell and
# throws the high one away, so the palette row, the priority bit and both flips
# are gone from the file: an 8-bit number is all there is to read, and a
# character number above 255 did not survive the conversion either.
# See docs/graphics-formats-reference/scgcad-formats.md §10.
id = "preset.tilemap.scgcad-std"
name = "Converted screen cell (8-bit, index only)"
engine_id = "codec.tilemap-packed"

[params]
bytes = 1
endian = "little"
index = { shift = 0, bits = 8 }
