# Master System / Game Gear nametable entry — 16-bit little-endian: index 0-8,
# H flip 9, V flip 10, palette select 11 (sprite bank vs background bank),
# priority 12.
id = "preset.tilemap.sms-bg"
name = "Master System nametable (16-bit, also Game Gear)"
engine_id = "codec.tilemap.packed"
category = "Sega"

[params]
bytes = 2
endian = "little"
# Bits 13-15 are `f` rather than `.` because the VDP ignores them and games
# therefore use them: a stored screen commonly carries collision or damage-zone
# flags up there, one per cell, and clearing them on a write would strip a
# level of its hazards. Carried through untouched instead, so a round-trip of a
# cell nothing was changed on is byte-exact
# (docs/rom-mapping/console-master-system.md §4).
fields = "fffo pvhi iiii iiii"
# No page geometry: the nametable is 32 columns by 24, 28 or 32 rows depending
# on the display mode and on whether a stored screen holds the whole table or
# only the visible part of it, so a cell count does not name one shape.
