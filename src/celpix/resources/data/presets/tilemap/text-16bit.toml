# A text run — one 16-bit word per character, little-endian. Its sibling
# `text-8bit` is the commoner form; this is what a font with more than 256 glyphs
# needs, so it is the shape a Japanese script is stored in.
#
# `layout = "text"` is what makes it a **fontmap**, and the codes it is read
# through are the font's rather than this preset's — `text-8bit` is the same
# argument at half the width.
#
# What the width changes is where the punctuation sits. A word no tile draws
# still needs a row to be named on, and at 16 bits the terminator is routinely
# far past the end of the sheet — `$FFFF` over a 4096-glyph font. That is what
# the window's **Append** spin is for: it lists rows beyond the last tile, and
# what is typed into one is stored as a named code at the value the row's header
# shows.
id = "preset.tilemap.text-16bit"
name = "Text run (16-bit character codes)"
engine_id = "codec.tilemap.packed"
category = "Text"

[params]
layout = "text"
bytes = 2
endian = "little"
fields = "iiii iiii iiii iiii"
