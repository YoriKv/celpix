# Sprite object (OBJ/OBX) subsprite record — 6 bytes, and not a grid cell at all:
# every record carries a signed pixel offset from the object's origin, and those
# offsets are mostly not multiples of 8, so a frame's subsprites cannot be laid
# out on a tile grid. The engine hands the view frames of subsprites instead, and
# the cells stay the file's own records so a write puts back what was read.
#
#   byte 0    bit 7 drawn, bit 0 which of the two sizes
#   byte 1    the tool's group byte - carried, not interpreted
#   byte 2/3  Y then X, both signed
#   byte 4-5  the console's sprite attribute word
#
# `subsprite_tiles` is the pair that size bit chooses between, each a square that
# many tiles on a side. The file does not record which pair the game set - it was
# a register - so this is the commonest one and the bar lets the user change it.
#
# `endian` is only the fallback: 26 of the 1,341 objects in the corpus come from
# a later build of the tool that stores the attribute word the other way round,
# and the container reads that out of the file's own build marker.
# See docs/graphics-formats-reference/scgcad-formats.md §8.
id = "preset.tilemap.scgcad-object"
name = "Sprite object subsprite (OBJ/OBX)"
engine_id = "codec.tilemap.scgcad-object"

[params]
# A **sprite map**: the tilemap variant whose cells are freely-placed subsprites
# grouped into frames rather than positions in a grid (tilemap-entry.md sec 6).
# Declared rather than inferred so the bar can describe an object before anything
# is bound to it, exactly as `indirect` does for a stamp layout.
layout = "sprite"
# A sprite's 3-bit palette field counts from CGRAM row 8: the console keeps OBJ
# palettes in the upper half of CGRAM (snes-hardware-notes.md sec 6). So row 0
# here means row 8 there, and without this the object draws through the
# background's colours.
#
# The last word, not the first. An object's own header states no base, but the
# tile bank it is bound to does, and that is the origin the bank's per-tile row
# table counts from too - so a bank that says otherwise wins over this
# (scgcad-formats.md sec 8.5). What stays here is the answer for a bank with no
# header, and for bytes bound through anything that is not a bank at all.
palette_row_base = 8
endian = "big"
subsprites_per_frame = 64
subsprite_tiles = [1, 2]
