# Panel (PNL) tile table — the SNES BG fields byte-swapped. One word is one 8x8
# tile: a panel is a scratch sheet the artist arranges tiles on, and a 16x16 unit
# is four adjacent words rather than one word standing for four tiles. That holds
# for all 1,172 surveyed panels, including the 80 whose header byte at 0x62 says
# 16x16 — a panel has three header bytes shaped like a cell size (0x62 and the
# stamp exponents at 0x69/0x6A) and not one of them is one. A screen's
# equivalent field *is* real, which is why the screen container reads its own.
# See docs/graphics-formats-reference/scgcad-formats.md §3.1.
id = "preset.tilemap.scgcad-panel"
name = "Panel tiles (PNL, byte-swapped)"
engine_id = "codec.tilemap.packed"
category = "S-CG-CAD"

[params]
bytes = 2
endian = "big"
fields = "vhop ppii iiii iiii"
