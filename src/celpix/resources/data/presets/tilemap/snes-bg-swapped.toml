# The same SNES BG fields stored MSB-first. Authoring tools that byte-swap on
# save produce this; the panel (PNL) tile table is the case it was added for.
# See docs/graphics-formats-reference/scgcad-formats.md §5.2.
id = "preset.tilemap.snes-bg-swapped"
name = "SNES BG map (16-bit, byte-swapped)"
engine_id = "codec.tilemap.packed"
category = "Nintendo"

[params]
bytes = 2
endian = "big"
fields = "vhop ppii iiii iiii"
