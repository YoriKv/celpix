# Transfer object (OBZ) subsprite record — 6 bytes, frames of freely placed
# subsprites like a sprite object's, and not one field in the same place:
#
#   byte 0    bit 7 drawn, bit 6 which of the two sizes,
#             bits 0-3 the character number's high nibble
#   byte 1    character number's low byte - 12 bits in all, where a sprite
#             object's is 9
#   byte 2/3  X then Y, both signed - the sprite object stores Y first
#   byte 4    the console's attribute bits as a loose byte, `vhoocccx`
#   byte 5    the tool's group byte - carried, not interpreted
#
# `subsprite_tiles` is the pair the size bit chooses between, as for a sprite
# object: the file does not record which pair the game set.
# See docs/graphics-formats-reference/scgcad-formats.md §9.
id = "preset.tilemap.scgcad-obz"
name = "Transfer object subsprite (OBZ)"
engine_id = "codec.tilemap.scgcad-obz"
category = "Authoring tools"

[params]
# A **sprite map**: the tilemap variant whose cells are freely-placed subsprites
# grouped into frames rather than positions in a grid (tilemap-entry.md sec 6).
# Declared rather than inferred so the bar can describe an object before anything
# is bound to it, exactly as `indirect` does for a stamp layout.
layout = "sprite"
# A sprite's 3-bit palette field counts from CGRAM row 8: the console keeps OBJ
# palettes in the upper half of CGRAM (snes-hardware-notes.md sec 6). So row 0
# here means row 8 there, and without this the object draws through the
# background's colours.
palette_row_base = 8
subsprites_per_frame = 64
subsprite_tiles = [1, 2]
