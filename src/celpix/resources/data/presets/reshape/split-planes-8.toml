# A region cut into 8 equal parts, part k holding every tile's k-th byte in
# turn, joined byte by byte into one stream so the ordinary presets read it.
# Not a plane split but MAME's ROM_LOAD64_BYTE: eight chips feeding one byte
# lane each of a 64-bit bus, the same interleave with a larger N. There is no
# seven-part preset because no driver splits a region into sevenths.
# The split is a fraction of the region, so apply it to exactly the graphics
# region (docs/design/reshape-stage.md §7).
id = "reshape.split-planes-8"
name = "Split bitplanes (8 ROMs, join)"
engine_id = "reshape.split-parts"
category = "Arcade"

[params]
parts = 8
