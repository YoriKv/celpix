# Two 4bpp pixels woven bit by bit through one byte: the even bit positions
# carry one pixel's index, the odd ones the other. De-interleaving gathers each
# pixel's four bits back into its own nibble, after which the byte is an
# ordinary packed 4bpp pair and `codec.packed` reads the tile unchanged.
#
# The two weave phases differ only in which pixel ends up in the high nibble,
# and that is exactly what the packed codec's `msb_first` already selects — so
# one table serves both. Pair with `preset.pixel.genesis-4bpp` when the odd bits
# hold the left pixel, `preset.pixel.gba-4bpp` when the even ones do.
#
# In MAME terms: a gfx_layout with planeoffset { 0, 2, 4, 6 } and xoffset in
# adjacent pairs ({ 0, 1, 8, 9, ... }). See docs/design/reshape-stage.md §8.
id = "reshape.deinterleave-nibbles"
name = "De-interleave alternating bits into nibbles"
engine_id = "reshape.data-lut"

[params]
bitswaps = [[7, 5, 3, 1, 6, 4, 2, 0]]
