# Example preset: `codec.palette.mask` — palette entries as packed bit fields.
#
# To use: copy, remove the leading "_", edit, press F5. "_" files are ignored and
# rewritten at startup.
#
# A preset is data: it names one engine (`engine_id`) and sets its `[params]`.
# The folder sets the stage; no `stage` key is needed. There is one example per
# palette engine in this folder. Params are checked on first use, not at load: an
# invalid preset loads and then fails on the palette that uses it.
#
# ENGINE
#   Fixed-size entries storing colour as bit fields. An entry's bytes are
#   assembled into one value by `byte_order`; each channel is sliced out and
#   scaled to 8 bits. Same kernel as codec.pixel.direct-color
#   (pixel/_direct-color.toml). For palettes that index a fixed hardware colour
#   table, see _color-indexed.toml.
#
#   Round trip: a channel of 8 bits or fewer is exact. Bits no field names are
#   written as zero. A channel wider than 8 bits loses its low bits. An edited
#   colour is quantised to the channel width.
#
# SHIPPED PRESETS ON THIS ENGINE
#   bgr555           2 bytes little-endian, `.bbb bbgg gggr rrrr`. SNES, GBC, GBA.
#   genesis-9bpp     2 bytes big-endian, `.... bbb. ggg. rrr.`. Mega Drive CRAM.
#   rgb888           3 bytes, one byte per channel.
#   rgb555-split-be  `rrrr gggg bbbb rgb.`: each channel in two runs.
#   gb-bgp           `vv`, bits_per_entry 2, invert: four shades per byte.
#   ws-gray          `.vvv`, bits_per_entry 4, invert.
#   ngp-gray         `.... .vvv`, one byte per entry, invert.

id = "preset.palette.example-color-mask"  # unique and stable; never shown
name = "Example RGB555"  # shown in the palette format picker
engine_id = "codec.palette.mask"

[params]

# Bit layout of the assembled entry: one letter per bit, most significant
# first. Letters are case-insensitive; whitespace and `|` are separators.
#
#   r g b a   red, green, blue, alpha
#   v         one shade driving r, g and b; overrides them if present
#   .         unused bit, written as zero (`-`, `0` and `x` also accepted)
#
# Every bit must have a letter, and the bit count must equal the entry width.
# No `a` field: every entry decodes opaque. A channel split across the entry is
# written where it sits; its runs join in reading order (`rrrr gggg bbbb rgb.`).
# On write, `v` stores the colour's luma.
fields = ".rrr rrgg gggb bbbb"

# Optional: rename letters. Key: one character. Value: r, g, b, a or v.
#   [params.legend]
#   c = "b"

# Bytes per entry. Default: derived from the layout's bit count. If given, it
# must match the layout. Also the stride of a palette read window.
bytes_per_entry = 2

# Sub-byte entries: use this instead of bytes_per_entry (mutually exclusive).
# 1, 2 or 4: a byte holds 8 / n entries, filled from the low bits up. 8 or more
# must be a multiple of 8 and is bytes_per_entry stated in bits.
# bits_per_entry = 2

# Order of the entry's bytes in the file: "little" (default) or "big". Any
# other value is an error.
# Independent of `fields`, which always describes the assembled value.
byte_order = "little"

# Complement every field, alpha included, before scaling. Default false. For
# greyscales that count darkness (0 = white), as the handheld shade registers do.
invert = false
