# Example preset for the `codec.palette.mask` engine. Files starting with "_" are
# ignored — copy this file, drop the underscore, edit it, press F5 in celPix.
#
# A preset names one built-in engine and fills in its parameters, so a file is
# only useful for the engine it names. This folder has one example per palette
# engine. Sitting in palette/ is what makes it an interpret-palette format — no
# stage field needed.
#
# WHAT THE ENGINE DOES
# --------------------
# Fixed-size palette entries storing colour as packed bit fields — essentially
# every hardware palette that is not a lookup into fixed silicon colours (for
# those, see _color-indexed.toml). An entry's bytes are assembled into one value
# by `byte_order`, and each channel is sliced out and scaled up to 8 bits. A
# channel narrower than 8 bits is lossy: the *decoded colour* round-trips, the raw
# bits cannot.
#
# Same arithmetic as codec.pixel.direct-color (_direct-color.toml), applied to a
# palette entry rather than to a pixel.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   bgr555          2 bytes little-endian, `.bbb bbgg gggr rrrr` — SNES, Game Boy
#                   Color, GBA.
#   genesis-9bpp    2 bytes big-endian, `.... bbb. ggg. rrr.` — three bits a
#                   channel, three bits apart, the Mega Drive's CRAM.
#   rgb888          3 bytes, a whole byte a channel, nothing lossy.
#   rgb555-split-be `rrrr gggg bbbb rgb.` — each channel in two pieces.
#   gb-bgp          `kk` with bits_per_entry 2 and invert — four shades in one
#                   register byte, counting darkness.
#   ws-gray         `.vvv` with bits_per_entry 4 — the same idea a nibble wide.
#   ngp-gray        `.... .vvv` over a whole-byte entry.

id = "preset.palette.example-color-mask"
name = "Example RGB555"
engine_id = "codec.palette.mask"

[params]

# WHERE THE COMPONENTS SIT: one letter per bit, most significant first — the
# diagram your format's own documentation draws. Whitespace groups it for
# counting and means nothing; group in nibbles and each group is one hex digit.
#
#   r  red      g  green      b  blue      a  alpha
#   v  one value — a brightness, driving r, g and b together; see below
#   .  a bit no component claims
#
# The layout below is RGB555 in a 16-bit entry, `0RRRRRGG GGGBBBBB`:
fields = ".rrr rrgg gggb bbbb"

# Every bit gets a letter: a bit nobody names is written back as ZERO on save, and
# `.` is you saying so. The layout is checked against the entry width, so a short
# diagram is a load error rather than a colour that quietly loses its top bits. A
# component the format has not got never appears — leave `a` out and every entry
# decodes opaque. A channel SPLIT across the entry (how several 68000 boards keep
# their nibbles byte-aligned) needs nothing said: write it where it is and the
# runs are one channel, in the order they are read — `"rrrr gggg bbbb rgb."`.
#
# A format that spells a channel some other way can keep its own letters:
#
#   [params.legend]
#   c = "b"    # `c` in the diagram means blue

# How many bytes one palette entry occupies. Optional — the layout already says —
# but worth stating, and the two are checked against each other. It also sizes a
# "load N entries" window.
bytes_per_entry = 2

# How those bytes are assembled into the value the layout describes. Only
# meaningful above one byte, and it orders the entry's bytes IN THE FILE; the
# layout is always the assembled value, high bit first, so the two are
# independent.
#   "little"  first byte is least significant   (the default)
#   "big"     first byte is most significant
byte_order = "little"

# For an entry SMALLER than a byte, replace `bytes_per_entry` with this (the two
# are mutually exclusive). A handheld's shade register is four two-bit entries in
# one byte, so nothing on disk is one entry wide to point at. Sub-byte entries
# fill each unit from the LOW bits up, the order both handheld families use; a
# value of 8 or more is `bytes_per_entry` spelt in bits, anything else divides 8.
# bits_per_entry = 2

# Does a field count DARKNESS rather than brightness? The handhelds' greyscales
# do — 0 is white on all three — so the scaled value is flipped end for end after
# the field is read.
#   false  0 is black, the usual way round   (the default)
invert = false

# ONE SHADE rather than three channels? Spell that field `v` (`.... .vvv`) and it
# drives r, g and b together. Naming those bits `r`, `g` and `b` instead is
# refused — one bit carries one letter — and an arbitrary colour written through
# `v` is reduced by luma.
