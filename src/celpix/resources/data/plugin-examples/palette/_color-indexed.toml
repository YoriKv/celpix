# Example preset for the `codec.color-indexed` engine. Copy, drop the
# underscore, edit, press F5. See _color-mask.toml for what a preset is.
#
# WHAT THE ENGINE DOES
# --------------------
# codec.color-indexed is for hardware whose palette bytes are **not** colour at
# all, but indices into a fixed table baked into the machine — EGA, MSX, the NES.
# One stored byte selects one entry, always, so the entry size is not a parameter
# the way it is for codec.color-mask.
#
# Encoding picks the **nearest** table entry — by Manhattan distance in RGB,
# there being no inverse when several slots share a colour — so a colour that is
# not in the table resolves to the closest one that is. An exact colour therefore
# round-trips, while an edited one is quantised to what the hardware can show.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   ega-indexed   the 16 EGA colours.
#   nes-indexed   the NES's fixed palette.
#   msx-indexed   the MSX's 16 colours.
#
# For a table you would rather load from a file than write out here, see
# _nes-custom.py — a code plugin doing exactly that.

id = "preset.palette.example-color-indexed"
name = "Example 8-color indexed"
engine_id = "codec.color-indexed"

[params]

# The machine's fixed colour table, as 0xRRGGBB entries, in hardware order — a
# stored byte is an index straight into this list. The engine's only parameter.
#
# The length is the table's own; it need not be a power of two, and a stored byte
# outside it decodes to the missing-colour sentinel rather than wrapping. Alpha
# is not part of an entry — every colour here decodes opaque.
colors = [
  0x000000, 0x0000AA, 0x00AA00, 0x00AAAA,
  0xAA0000, 0xAA00AA, 0xAA5500, 0xAAAAAA,
]
