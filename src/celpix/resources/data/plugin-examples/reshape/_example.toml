# Example bitswap reshape preset. Files starting with "_" are ignored - copy
# this file, drop the underscore from the name, edit it, and press F5 in
# celPix to load it. Presets are data: nothing here executes, so unlike a .py
# plugin there is no confirmation step.
#
# A bitswap is the way most arcade boards scramble a graphics region: a
# permutation of the byte *address*, one algorithm with a per-board table.
# This preset names that engine and gives the table; celPix turns it into an
# ordinary Reshape entry in the pickers. Hand-written .py reshapes (see
# _example.py) are the escape hatch for reorderings that are not address
# permutations - the shipped split-plane joins, for instance.
id = "reshape.example-bitswap"
name = "Example bitswap (swap middle quarters)"
engine_id = "reshape.bitswap"

[params]
# MAME's bitswap argument order, most significant bit first: entry k names the
# source address bit of output bit N-1-k, and j = bitswap<N>(i, ...) says
# where byte i lands (out[j] = in[i] - the descramble scatter form; a driver
# written as dst[i] = src[bitswap(i)] sets `gather = true` instead of
# hand-inverting its table). A table of N entries defines a 2^N-byte block:
# the region is permuted block by block, a tail short of one block passes
# through untouched, and a region smaller than one block refuses to load -
# the table and the region disagree about the hardware.
#
# This 5-bit toy swaps address bits 4 and 3, exchanging the two middle
# 8-byte quarters of every 32-byte block. Real tables are lifted verbatim
# from a board's MAME driver (grep its init_ function for bitswap).
bits = [3, 4, 2, 1, 0]
