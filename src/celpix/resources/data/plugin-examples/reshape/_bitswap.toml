# Example bitswap reshape preset. Files starting with "_" are ignored — copy
# this file, drop the underscore, edit it, and press F5 in celPix to load it.
# Presets are data: nothing here executes, so unlike a .py plugin there is no
# confirmation step.
#
# A bitswap is how most arcade boards scramble a graphics region: a permutation
# of the byte *address*, one algorithm with a per-board table. This preset names
# that engine and supplies the table; celPix turns it into an ordinary Reshape
# entry in the pickers. For value substitutions see _data-lut.toml, and for
# reorderings neither engine expresses, _example.py.
#
# No bitswap table ships active, a table meaning something only for the board it
# came from. This is a real, working one to copy and adapt.
id = "reshape.gaelco-16x16"
name = "Gaelco 16x16 tiles (bitswap)"
engine_id = "reshape.bitswap"

[params]
# Gaelco "Modular System" 16x16 tile scramble: the background ROMs store each
# tile in an order the single-pass codecs can't walk, undone in hardware terms by
# rotating address lines 14..5. Shared by Splash!, Big Karnak, World Rally,
# Xorworld, Gals Panic, Blood Bros., Raiden and Toki on that board (MAME:
# descramble_16x16tiles in each of the *_ms.cpp drivers, bitswap<20>). Once
# applied, the region reads with the stock sms-4bpp preset, 16x16 tiles under a
# 2x2 block arrangement.
#
# The table is MAME's argument order, most significant bit first: entry k names
# the source address bit of output bit N-1-k, and j = bitswap<N>(i, ...) says
# where byte i lands (out[j] = in[i], the descramble scatter form; a driver
# written as dst[i] = src[bitswap(i)] sets `gather = true` instead of
# hand-inverting its table). A table of N entries defines a 2^N-byte block: the
# region is permuted block by block, a tail short of one block passes through
# untouched, and a region smaller than one block refuses to load, the table and
# the region disagreeing about the hardware.
#
# To lift your own: grep a board's init_ function in MAME for bitswap and copy
# the argument list. A table may span up to 24 address lines, of which at most 16
# may move — real tables hold their low lines fixed, and this one leaves A4..A0
# alone and moves 15.
bits = [19, 18, 17, 16, 15, 12, 11, 10, 9, 8, 7, 6, 5, 14, 13, 4, 3, 2, 1, 0]
