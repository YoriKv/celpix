# Example preset: `reshape.bitswap` — an address-line permutation.
#
# To use: copy, remove the leading "_", edit, press F5. "_" files are ignored and
# rewritten at startup. Presets are data: nothing executes and no confirmation
# is asked. `engine_id` selects the reshape engine; this folder has one example
# for each (see _data-lut.toml). For a reordering neither expresses, _example.py.
#
# ENGINE
#   Permutes the byte ADDRESS; byte values are unchanged. A table of N entries
#   defines a 2^N-byte block. The region is permuted block by block, a tail
#   shorter than one block passes through, and a region smaller than one block
#   is an error. The inverse is derived, so edits write back.
#
# SHIPPED PRESETS ON THIS ENGINE
# None: a table is specific to its board. This example carries a working one.

id = "reshape.gaelco-16x16"
name = "Gaelco 16x16 tiles (bitswap)"
engine_id = "reshape.bitswap"

[params]

# Required. The permutation in the argument order of MAME's `bitswap<N>`: most
# significant bit first, entry k naming the source address bit of output bit
# N - 1 - k. A driver's argument list copies in unchanged. Up to 24 entries, of
# which at most 16 may differ from the identity.
#
# This table is the Gaelco "Modular System" 16x16 tile scramble (MAME:
# descramble_16x16tiles in the *_ms.cpp drivers), used by Splash!, Big Karnak,
# World Rally, Xorworld, Gals Panic, Blood Bros., Raiden and Toki on that board.
# It rotates address lines 14-5. The result reads with the shipped sms-4bpp
# preset as 16x16 tiles.
bits = [19, 18, 17, 16, 15, 12, 11, 10, 9, 8, 7, 6, 5, 14, 13, 4, 3, 2, 1, 0]

# Direction the table is applied. Default false.
#   false  scatter: out[bitswap(i)] = in[i]   (driver writes `buffer[j] = src[i]`)
#   true   gather:  out[i] = in[bitswap(i)]   (driver writes `dst[i] = src[bitswap(i)]`)
# The wrong direction applies the inverse permutation, which shows as a
# differently scrambled image.
gather = false
