# Example preset: `reshape.data-lut` — a byte-value substitution.
#
# To use: copy, remove the leading "_", edit, press F5. See _bitswap.toml for
# what a reshape preset is.
#
# ENGINE
#   Substitutes the byte VALUE; bytes do not move. (_bitswap.toml is the
#   opposite. An entry takes one reshape, so a board that does both is not fully
#   readable.) Each table is a 256-entry lookup, given as a bit permutation
#   (`bitswaps`) or literally (`luts`). Every table must be a bijection, so the
#   inverse exists and edits write back.
#
# SHIPPED PRESETS ON THIS ENGINE
# Bit-order conventions, not board scrambles:
#
#   reshape.deinterleave-nibbles  [[7,5,3,1,6,4,2,0]]: two 4bpp pixels
#                                 interleaved bit by bit, regrouped into nibbles
#                                 for codec.pixel.packed.
#   reshape.reverse-nibble-bits   [[4,5,6,7,0,1,2,3]]: leftmost pixel in bit 0 of
#                                 each nibble; for codec.pixel.nibble-planar.
#   reshape.reverse-byte-bits     [[0,1,2,3,4,5,6,7]]: rows stored lsb-first
#                                 (MAME's GFXENTRY_REVERSE).

id = "reshape.nmk-bg"
name = "NMK background GFX descramble"
engine_id = "reshape.data-lut"

[params]

# Width of the substituted value. Default 1.
#   1  bytes
#   2  big-endian 16-bit words, for permutations that move bits between the two
#      bytes. A trailing odd byte passes through. Requires `bitswaps`.
unit = 1

# Offset bits that select the table, least significant first. N bits need
# exactly 2^N tables. Up to 4 bits, each at most bit 20. Omit for one table.
# With unit = 2, bit 0 is not allowed.
#
# From bjtwin_address_map_bg0 in MAME's nmk16.cpp:
#   ((A & 0x00004) >> 2) | ((A & 0x00800) >> 10) | ((A & 0x40000) >> 16)
selector_bits = [2, 11, 18]

# Optional: the table index for each selector value, for boards with a lookup
# between the address bits and the table. One distinct index per table.
# selector_remap = [0, 4, 2, 6, 1, 5, 3, 7]

# The tables as bit permutations, in the argument order of MAME's `bitswap<>`:
# most significant bit first, entry k naming the source bit of output bit
# N - 1 - k. One per selector value, in selector order.
#
# These are decode_data_bg from decode_gfx in nmk16.cpp (Cactus, the GunNail
# bootleg); the NMK214 device applies the same eight to Macross, GunNail,
# Saboten Bombers, Bombjack Twin and Nouryoku Koujou Iinkai.
bitswaps = [
    [3, 0, 7, 2, 5, 1, 4, 6],
    [1, 2, 6, 5, 4, 0, 3, 7],
    [7, 6, 5, 4, 3, 2, 1, 0],
    [7, 6, 5, 0, 1, 4, 3, 2],
    [2, 0, 1, 4, 3, 5, 7, 6],
    [5, 3, 7, 0, 4, 6, 2, 1],
    [2, 7, 0, 6, 5, 3, 1, 4],
    [3, 4, 7, 6, 2, 0, 5, 1],
]

# Alternative to `bitswaps` (give exactly one): literal tables of 256 output
# values, for an XOR mask or an arbitrary substitution. unit = 1 only.
# luts = [[ 210, 211, 208, ... ]]   # XOR 0xD2
