# Example preset: `compression.compress-reshape` — a compression scheme followed
# by a reshape.
#
# To use: copy, remove the leading "_", edit, press F5. "_" files are ignored and
# rewritten at startup. Presets are data: nothing executes and no confirmation
# is asked. File > New Compress & Reshape Plugin... writes one into the open
# project.
#
# ENGINE
#   For data the game transforms after unpacking it:
#
#       load:  decompress -> reshape
#       save:  unshape    -> compress
#
#   An entry's own Reshape stage runs before decompression, over the packed
#   bytes, so it cannot do this. The pair appears in the Compression picker as
#   one scheme. It is self-delimiting if its compression half is, writes back if
#   both halves do, and takes the inputs its compression half declares.
#
#   Typical case: a tilemap stored as differences. The loader unpacks the stream
#   and sums it (Z80: XOR A / loop: ADD A,(HL) / LD (HL+),A). Symptom: the
#   unpacked map is mostly $00 and $01 and draws as noise.
#
# SHIPPED PRESETS ON THIS ENGINE
# None: the pairing is specific to a game. This example carries a working one,
# used by Mortal Kombat II (Game Boy) for its title-screen maps.

id = "compression.rnc2-running-sum"
name = "RNC ProPack method 2 + running sum"
engine_id = "compression.compress-reshape"

[params]

# Required. Plugin id of the compression scheme: any entry of the Compression
# picker except "None" and another pair.
compression = "compression.rnc2"

# Required. Plugin id of the reshape applied to the whole decompressed stream:
# any entry of the Reshape picker except "None", including your own bitswap and
# data-LUT presets.
reshape = "reshape.running-sum"
