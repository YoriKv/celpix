# Example preset for the `codec.pce-sg` engine. Copy, drop the underscore, edit,
# press F5. See _planar.toml for what a preset is.
id = "preset.pixel.example-pce-sg"
name = "Example PC Engine SuperGrafx 4bpp 16x16"

# codec.pce-sg decodes the PC Engine SuperGrafx 4bpp 16x16 sprite tile. Like
# _pce-2bpp16.toml its byte walk is fixed by the hardware, so it takes **no
# parameters** — copy this only to list the format under your own name.
engine_id = "codec.pce-sg"

