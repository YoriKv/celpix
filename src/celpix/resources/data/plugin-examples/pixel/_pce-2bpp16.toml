# Example preset for the `codec.pce-2bpp16` engine. Copy, drop the underscore,
# edit, press F5. See _planar.toml for what a preset is.
id = "preset.pixel.example-pce-2bpp16"
name = "Example PC Engine 2bpp 16x16"

# codec.pce-2bpp16 decodes the PC Engine's 2bpp 16x16 sprite tile. The hardware
# fixes its intra-tile byte walk, so the engine takes **no parameters** and a
# preset only supplies a name. Copy this to list the format under one of your
# own; there is nothing to tune.
engine_id = "codec.pce-2bpp16"

