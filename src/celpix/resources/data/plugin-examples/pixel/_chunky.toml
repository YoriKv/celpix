# Example preset for the `codec.chunky` engine. Copy, drop the underscore, edit,
# press F5. See _planar.toml for what a preset is.
id = "preset.pixel.example-chunky"
name = "Example chunky 8bpp"

# codec.chunky decodes formats with **one whole byte per pixel**, row-major: the
# byte is the index. Unlike the 8x8-only engines the tile size is free, so this
# also reads whole-bitmap sources (SNES Mode 7's 128x128 bank, DS/N64 textures)
# by naming their dimensions. For pixels wider than a byte — which carry colour
# rather than an index — use _direct-color.toml.
engine_id = "codec.chunky"

[params]
bpp = 8            # 8 only: one byte, one index
tile_width = 8
tile_height = 8
