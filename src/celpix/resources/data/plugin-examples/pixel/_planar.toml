# Example preset: `codec.pixel.planar` — bitplane tiles.
#
# To use: copy, remove the leading "_", edit, press F5. "_" files are ignored and
# rewritten at startup.
#
# A preset is data: it names one engine (`engine_id`) and sets its `[params]`.
# The folder sets the stage; no `stage` key is needed. There is one example per
# pixel engine in this folder. Params are checked on first use, not at load: an
# invalid preset loads and then fails on the entry that uses it. Values are
# strict: a boolean must be true or false (not a string), and a parameter with
# a fixed set of values rejects any other.
#
# ENGINE
#   Bit k of a pixel's index is read from plane k. Within a plane byte, pixel x
#   of an eight-pixel group is bit 7 - x. Plane k's byte for pixel row y and
#   group g (g = x // 8):
#
#       offset = base[k] + stride[k] * y + group_stride[k] * g
#
# SHIPPED PRESETS ON THIS ENGINE
#   snes-2bpp          planes {0,2} {1,2}: interleaved byte by byte.
#   nes-2bpp           planes {0,1} {8,1}: plane 1 in the tile's second half.
#   sms-4bpp           planes {k,4}: four planes interleaved per row.
#   4bpp-planar-16x16  tile_width 16, group_stride 4.
#   1bpp-16x11-ff6     group_stride -1: the right half is stored first.

id = "preset.pixel.example-planar"  # unique and stable; never shown
name = "Example planar 2bpp (GB-style)"  # shown in the format picker
engine_id = "codec.pixel.planar"

[params]

# Bits per pixel, 1-8. Must equal the number of `planes` entries.
bpp = 2

# One entry per plane. Entry k supplies bit k; entry 0 is the low bit.
#   base          required. Byte offset of the plane at row 0, group 0.
#   stride        required. Bytes between pixel rows.
#   group_stride  default 0. Bytes between eight-pixel groups in a row. Used
#                 when tile_width > 8. May be negative.
# Every offset must fall inside the tile: tile_width * tile_height * bpp / 8
# bytes (16 here). Planes are not checked for overlap.
planes = [
  { base = 0, stride = 2, group_stride = 0 },  # bytes 0, 2, 4, ...
  { base = 1, stride = 2, group_stride = 0 },  # bytes 1, 3, 5, ...
]

# Tile size in pixels. Default 8 each. tile_width must be a multiple of 8.
tile_width = 8
tile_height = 8
