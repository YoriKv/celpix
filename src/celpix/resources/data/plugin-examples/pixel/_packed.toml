# Example preset: `codec.pixel.packed` — packed (linear) tiles.
#
# To use: copy, remove the leading "_", edit, press F5. See _planar.toml for
# what a preset is.
#
# ENGINE
#   A pixel's index is one field of `bpp` bits stored whole. A byte holds
#   8 / bpp pixels; a row is tile_width / (8 / bpp) bytes, left to right.
#   For 3bpp and 6bpp see _packed-straddling.toml. For pixels wider than a byte
#   (colour, not an index) see _direct-color.toml.
#
# SHIPPED PRESETS ON THIS ENGINE
#   genesis-4bpp           bpp 4, msb_first. Mega Drive, 32X, X68000, MSX.
#   gba-4bpp               bpp 4, low nibble first.
#   vb-2bpp                bpp 2, pixel 0 in the low bits.
#   ngp-2bpp-swapped       bpp 2, msb_first, reverse_bytes.
#   4bpp-linear-16x16-lsb  bpp 4, 16x16 tile.
#   8bpp-linear            bpp 8: one byte per pixel. SNES Mode 7, generic 8bpp.
#   snes-8bpp-bank         bpp 8, 128x128: a Mode 7 bank as one tile.

id = "preset.pixel.example-packed"
name = "Example packed 4bpp"
engine_id = "codec.pixel.packed"

[params]

# Bits per pixel: 1, 2, 4 or 8. With nibble_stride set: 2, 4 or 8.
bpp = 4

# Position of pixel 0 within a byte. Default false.
#   true   high field first (Mega Drive 4bpp: high nibble is the left pixel)
#   false  low field first (GBA 4bpp, Virtual Boy 2bpp)
msb_first = true

# Read each row's bytes right to left. Default false. Byte order along the row,
# not endianness: on the Neo Geo Pocket a row's second byte holds its left
# pixels.
reverse_bytes = false

# Split each index across two bytes `n` bytes apart: the first holds the high
# bpp / 2 bits, the second the low. Default 0 (off). Requires an even bpp, and
# n must divide half the tile's byte size. For boards that keep each half of
# the index in its own ROM: after a two-part region join has interleaved the
# halves, n is 1.
nibble_stride = 0

# Tile size in pixels. Default 8 each. tile_width must be a multiple of the
# pixels one byte holds (2 at 4bpp). With nibble_stride, a byte holds
# 8 / (bpp / 2) pixels.
tile_width = 8
tile_height = 8
