# Example preset: `codec.pixel.packed-straddling` — 3bpp and 6bpp packed tiles.
#
# To use: copy, remove the leading "_", edit, press F5. See _planar.toml for
# what a preset is.
#
# ENGINE
#   The two packed depths that do not divide 8, so a pixel's field crosses byte
#   boundaries. Both packings are fixed; the tile is always 8x8. For 1, 2, 4 or
#   8bpp use _packed.toml.
#
# SHIPPED PRESETS ON THIS ENGINE
#   3bpp-linear   bpp 3, 24 bytes a tile.
#   6bpp-linear   bpp 6, 48 bytes a tile.

id = "preset.pixel.example-packed-straddling"
name = "Example packed 3bpp (fields straddle bytes)"
engine_id = "codec.pixel.packed-straddling"

[params]

# The only parameter. Any other value is an error.
#   3   a row is three bytes
#   6   a row is six bytes, read in reverse byte order
bpp = 3
