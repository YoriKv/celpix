# Example preset for the `codec.pixel.packed-straddling` engine. Copy, drop the
# underscore, edit, press F5. See _planar.toml for what a preset is.
#
# WHAT THE ENGINE DOES
# --------------------
# codec.pixel.packed-straddling covers the two linear depths that do **not** divide
# 8, so their index fields straddle byte boundaries and no field-per-byte kernel
# expresses them. At 3bpp a row is three bytes with pixels spanning them; at 6bpp
# six bytes, read in reversed byte order. Both packings are hard-coded from the
# formats themselves, so the depth is the only parameter and the tile is 8x8.
#
# For 1, 2, 4 or 8bpp — the depths that *do* divide a byte — use _packed.toml,
# which is data-driven instead.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   3bpp-linear   bpp 3 — 24 bytes a tile.
#   6bpp-linear   bpp 6 — 48 bytes a tile, the row's bytes reversed.

id = "preset.pixel.example-packed-straddling"
name = "Example packed 3bpp (fields straddle bytes)"
engine_id = "codec.pixel.packed-straddling"

[params]

# Which of the two hard-coded packings to use — the engine's only parameter.
#   3   a row is three bytes, pixels spanning byte boundaries
#   6   a row is six bytes, read in reversed byte order
# Any other value is rejected rather than approximated.
bpp = 3
