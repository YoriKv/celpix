# Example preset: `codec.pixel.nibble-planar` — two bitplanes per byte.
#
# To use: copy, remove the leading "_", edit, press F5. See _planar.toml for
# what a preset is.
#
# ENGINE
#   One byte holds four pixels: its high nibble is one bitplane of those four
#   and its low nibble the next. Bit 3 of a nibble is the leftmost pixel:
#
#       index[i] = ((byte >> (7 - i)) & 1) << hi | ((byte >> (3 - i)) & 1) << lo
#
#   Above 2bpp each four-pixel group takes bpp / 2 bytes, most significant
#   plane pair first.
#
# SHIPPED PRESETS ON THIS ENGINE
#   atari-sy2-chars-2bpp    8x8 2bpp, 16 bytes a tile.
#   atari-sy2-tiles-4bpp    8x8 4bpp. Expects a buffer already interleaved by
#                           reshape.split-planes-2: the hardware keeps the
#                           second plane pair in the region's far half.
#   atari-sy2-sprites-4bpp  16x16 4bpp.

id = "preset.pixel.example-nibble-planar"
name = "Example nibble-planar 2bpp"
engine_id = "codec.pixel.nibble-planar"

[params]

# Bits per pixel: 2, 4, 6 or 8.
bpp = 2

# Tile size in pixels. Default 8 each. tile_width must be a multiple of 4.
tile_width = 8
tile_height = 8
