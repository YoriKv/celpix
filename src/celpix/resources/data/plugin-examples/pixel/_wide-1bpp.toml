# Example preset for the `codec.wide-1bpp` engine. Copy, drop the underscore,
# edit, press F5. See _planar.toml for what a preset is.
id = "preset.pixel.example-wide-1bpp"
name = "Example 1bpp 16x16"

# codec.wide-1bpp decodes 1bpp tiles **16 pixels wide**, so each row is two bytes
# rather than one. The three modes differ in where those bytes sit and how tall
# the tile is — no single stride expresses them, which is why this is its own
# engine rather than a preset over the planar one.
engine_id = "codec.wide-1bpp"

[params]
# "halves" — 16x16, byte 0 the left 8 pixels, byte 1 the right (the default)
# "ff5"    — 16x12, the two 8-wide columns 12 bytes apart
# "ff6"    — 16x11, the byte pair swapped per row
mode = "halves"
