# Example preset: `codec.pixel.palette-swatch` — bytes shown as palette colours.
#
# To use: copy, remove the leading "_", edit, press F5. See _planar.toml for
# what a preset is.
#
# ENGINE
#   Decodes the bytes with a palette format and draws one solid 8x8 swatch per
#   entry. Painting a swatch writes the entry back through the same format,
#   quantised to what it can store. One tile is one read unit of the palette
#   format: a format with several entries per unit (the Game Boy BGP register,
#   four shades a byte) gives a tile that many swatches wide. tile_width and
#   tile_height are ignored.
#
# SHIPPED PRESETS ON THIS ENGINE
#   view-as-palette   "View as Palette" in the Pixels dropdown. Sets no palette
#                     format.

id = "preset.pixel.example-palette-swatch"
name = "Example palette swatches (RGB888)"
engine_id = "codec.pixel.palette-swatch"

[params]

# Id of a palette preset (shipped, or one of yours in palette/). Default
# "preset.palette.bgr555". In the app, the toolbar's palette-format picker
# (shown while a preset on this engine is selected) sets the format per entry
# and overrides this value; it applies only where no pick exists.
palette_preset_id = "preset.palette.rgb888"
