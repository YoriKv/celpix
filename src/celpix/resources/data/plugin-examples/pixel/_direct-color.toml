# Example preset for the `codec.pixel.direct-color` engine. Copy, drop the underscore,
# edit, press F5. See _planar.toml for what a preset is.
#
# WHAT THE ENGINE DOES
# --------------------
# codec.pixel.direct-color decodes **palette-less** pixels: each one carries its own
# colour, so there is no index and no palette anywhere in the pipeline. A pixel
# is a fixed number of bytes, assembled into one value by `byte_order`, and each
# channel is then a plain bit mask over that value scaled up to 8 bits. A channel
# narrower than 8 bits is therefore lossy: the *decoded colour* round-trips, the
# raw bits cannot and never could.
#
# It shares its mask arithmetic with codec.palette.mask (_color-mask.toml) — the
# same maths, applied to a pixel rather than to a palette entry.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   dc-rgb565        bytes_per_pixel 2, little-endian, 5/6/5 masks.
#   dc-argb8888-be   bytes_per_pixel 4, big-endian, with an `a` mask.
#   dc-i8            one byte, and r/g/b given the *same* mask, so the value is
#                    replicated to grey — how the N64 intensity textures read.
#   dc-snes-direct   the SNES direct-colour mode's BBGGGRRR byte.

id = "preset.pixel.example-direct-color"
name = "Example direct color RGB565"
engine_id = "codec.pixel.direct-color"

[params]

# How many bytes one pixel occupies. Typically 1, 2, 3 or 4 — enough to hold
# every mask below. The tile is bytes_per_pixel * width * height bytes.
bytes_per_pixel = 2

# How those bytes are assembled into the value the masks apply to.
#   "little"  first byte is least significant   (the default)
#   "big"     first byte is most significant
# Only meaningful when bytes_per_pixel is more than 1.
byte_order = "little"

# Pixel size of one tile; both default to 8. Free, since a pixel here occupies
# whole bytes and so can never straddle one — this reads bitmaps of any size as
# well as console tiles.
tile_width = 8
tile_height = 8

# One bit mask per channel over the assembled pixel value. Keys are `r`, `g`, `b`
# and optionally `a`; omit `a` for a format with no alpha and every pixel decodes
# opaque. Each channel is scaled from however many bits its mask names up to 8,
# so masks of different widths are fine.
#
# Giving two channels the *same* mask is deliberate and useful: it replicates one
# stored value across them, which is how the intensity formats decode to grey.
#
# A channel split across the value — its main run in one place and a stray low
# bit parked elsewhere — is written as a list of contiguous chunks, MOST
# SIGNIFICANT FIRST, e.g. `r = [0xF000, 0x0008]`. The order is not inferred from
# bit position, hardware putting the stray bit above the run as often as below.
#
# Bits no mask names are written back as zero on save, so name every bit a
# channel really uses.
[params.masks]
r = 0xF800
g = 0x07E0
b = 0x001F
# a = 0x0000
