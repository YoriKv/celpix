# Example preset: `codec.pixel.direct-color` — pixels that carry their own colour.
#
# To use: copy, remove the leading "_", edit, press F5. See _planar.toml for
# what a preset is.
#
# ENGINE
#   No index and no palette. A pixel is `bytes_per_pixel` bytes, assembled into
#   one value by `byte_order`; each channel is sliced out of that value and
#   scaled to 8 bits. Same kernel as codec.palette.mask (palette/_color-mask.toml).
#
#   Round trip: a channel of 8 bits or fewer is exact. Bits no field names are
#   written as zero. A channel wider than 8 bits loses its low bits. A painted
#   colour is quantised to the channel width.
#
# SHIPPED PRESETS ON THIS ENGINE
#   dc-rgb565        2 bytes little-endian, `rrrr rggg gggb bbbb`.
#   dc-argb8888-be   4 bytes big-endian, alpha in the top byte.
#   dc-i8            `vvvv vvvv`: one intensity byte (N64 I8 textures).
#   dc-ia8           `vvvv aaaa`: intensity and alpha.
#   dc-snes-direct   `bbgg grrr`: the SNES direct-colour byte.

id = "preset.pixel.example-direct-color"
name = "Example direct color RGB565"
engine_id = "codec.pixel.direct-color"

[params]

# Bit layout of the assembled value: one letter per bit, most significant
# first. Letters are case-insensitive; whitespace and `|` are separators.
#
#   r g b a   red, green, blue, alpha
#   v         one brightness value driving r, g and b; overrides them if present
#   .         unused bit, written as zero (`-`, `0` and `x` also accepted)
#
# Every bit must have a letter, and the bit count must equal the pixel width.
# No `a` field: every pixel decodes opaque. A channel split across the value is
# written where it sits; its runs join in reading order (`rrrr gggg bbbb rgb.`).
# On write, `v` stores the OR of the three scaled channels, so a grey is exact.
fields = "rrrr rggg gggb bbbb"

# Optional: rename letters. Key: one character. Value: r, g, b, a or v.
#   [params.legend]
#   i = "v"

# Bytes per pixel. Default: the layout's bit count / 8. If given, it must match
# the layout. A tile is bytes_per_pixel * tile_width * tile_height bytes.
bytes_per_pixel = 2

# Order of the pixel's bytes in the file: "little" (default) or "big". Any
# other value is an error.
# Independent of `fields`, which always describes the assembled value.
byte_order = "little"

# Tile size in pixels. Default 8 each. Any size.
tile_width = 8
tile_height = 8
