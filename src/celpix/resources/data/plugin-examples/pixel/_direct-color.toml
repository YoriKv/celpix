# Example preset for the `codec.pixel.direct-color` engine. Copy, drop the
# underscore, edit, press F5. See _planar.toml for what a preset is.
#
# WHAT THE ENGINE DOES
# --------------------
# **Palette-less** pixels: each carries its own colour, so there is no index and
# no palette anywhere in the pipeline. A pixel is a fixed number of bytes,
# assembled into one value by `byte_order`, and each channel is sliced out of that
# value and scaled up to 8 bits. A channel narrower than 8 bits is therefore
# lossy: the *decoded colour* round-trips, the raw bits cannot and never could.
#
# Same arithmetic as codec.palette.mask (_color-mask.toml), applied to a pixel
# rather than to a palette entry.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   dc-rgb565        2 bytes little-endian, `rrrr rggg gggb bbbb`.
#   dc-argb8888-be   4 bytes big-endian, alpha in the top byte.
#   dc-i8            one byte, all of it `v` — the value replicated to grey, how
#                    the N64 intensity textures read.
#   dc-ia8           `vvvv aaaa` — the same idea with alpha beside it.
#   dc-snes-direct   the SNES direct-colour mode's byte, `bbgg grrr`.

id = "preset.pixel.example-direct-color"
name = "Example direct color RGB565"
engine_id = "codec.pixel.direct-color"

[params]

# WHERE THE COMPONENTS SIT: one letter per bit, most significant first — the
# diagram your format's own documentation draws. Whitespace groups it for
# counting and means nothing; group in nibbles and each group is one hex digit.
#
#   r  red      g  green      b  blue      a  alpha
#   v  one value — a brightness, driving r, g and b together
#   .  a bit no component claims
#
# The layout below is RGB565 in a 16-bit pixel, `RRRRRGGG GGGBBBBB`:
fields = "rrrr rggg gggb bbbb"

# Every bit gets a letter: a bit nobody names is written back as ZERO, and `.` is
# you saying so. The layout is checked against the pixel width, so a short diagram
# is a load error rather than a colour that quietly loses its top bits. A
# component the format has not got never appears — leave `a` out and every pixel
# decodes opaque. A channel SPLIT across the value needs nothing said: write it
# where it is and the runs are one channel (`"rrrr gggg bbbb rgb."`).
#
# `v` is for formats that store ONE value and mean grey: it drives r, g and b at
# once, so any grey the format can hold round-trips exactly, and a colour that is
# not grey collapses to the OR of the three on write.
#
# A format that spells a channel some other way can keep its own letters:
#
#   [params.legend]
#   i = "v"    # `i` in the diagram is the intensity

# How many bytes one pixel occupies. Optional — the layout already says — but
# worth stating, and the two are checked against each other. The tile is
# bytes_per_pixel * width * height bytes.
bytes_per_pixel = 2

# How those bytes are assembled into the value the layout describes. Only
# meaningful above one byte, and it orders the pixel's bytes IN THE FILE; the
# layout is always the assembled value, high bit first, so the two are
# independent.
#   "little"  first byte is least significant   (the default)
#   "big"     first byte is most significant
byte_order = "little"

# Pixel size of one tile; both default to 8. Free, since a pixel here occupies
# whole bytes and can never straddle one — this reads bitmaps of any size as well
# as console tiles.
tile_width = 8
tile_height = 8
