# Example tilemap preset — sprite object subsprites, the byte-per-field record.
#
# Copy this file, drop the leading underscore, edit it, and press F5 in celPix.
#
# A sprite engine: frames of subsprites at signed pixel offsets rather than cells
# in rows. The record layout is fixed in the engine, so a sprite-shaped format
# that lays its record out differently wants this engine's *code* copied, not
# this file.
#
# WHICH ENGINE IS WHICH
# ---------------------
# This is the byte-per-field engine: fields across single bytes rather than
# packed into a sprite attribute word, a 12-bit character number rather than 9,
# and X stored before Y. See _object.toml for the sprite engines' shared
# parameters and the other three records; anything in rows wants _packed.toml.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   scgcad-obz      the format this engine exists for, and the only one shipped
#                   on it.

id = "preset.tilemap.example-obz"
name = "Example transfer object subsprite"
engine_id = "codec.tilemap.scgcad-obz"

[params]
# Cells are freely-placed subsprites grouped into frames (tilemap-entry.md sec 6).
layout = "sprite"

# How many subsprite records make one frame — how the sheet is divided.
subsprites_per_frame = 64

# The two sizes the record's size bit chooses between, in tiles a side. Stated
# rather than read: the file does not record the pair.
subsprite_tiles = [1, 2]
