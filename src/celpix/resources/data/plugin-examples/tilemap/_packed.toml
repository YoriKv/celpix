# Example preset: `codec.tilemap.packed` — a grid of packed cell words.
#
# To use: copy, remove the leading "_", edit, press F5. "_" files are ignored and
# rewritten at startup.
#
# A preset is data: it names one engine (`engine_id`) and sets its `[params]`.
# The folder sets the stage; no `stage` key is needed. There is one example per
# tilemap engine in this folder. Params are checked on first use, not at load: an
# invalid preset loads and then fails on the entry that uses it.
#
# ENGINE
#   A tilemap holds references: each cell names a tile in the tile bank the map
#   is bound to, plus how to draw it. This engine reads fixed-width cells in
#   rows, each one integer with its fields at fixed bit positions.
#
#   Other tilemap engines:
#     _sprite-record.toml    sprite parts at pixel offsets, any byte-aligned record
#     _md-sprite.toml        the Mega Drive VDP sprite record
#     _sprite-table.toml     an offset table naming frames of sprite parts
#     _indirect-record.toml  one byte per metatile, naming a definition record
#   Anything else is a code format: _example.py.
#
# SHIPPED PRESETS ON THIS ENGINE (most shipped tilemap presets)
#   snes-bg          `vhop ppii iiii iiii`, 32x32 pages.
#   snes-bg-swapped  the same word, big-endian.
#   snes-bg-16x16    the same word, cell_tiles [2, 2].
#   gba-bg           `pppp vhii iiii iiii`, 32x32 pages.
#   gbc-bg           `ovh. ippp iiii iiii`: a split index.
#   index-8bit       `iiii iiii`: a bare tile number. gb-bg is the same cell.
#   text-8bit        `iiii iiii` with layout = "text". text-16bit: two bytes.
#   text-8bit-flag   `eiii iiii`: line break as a flag bit.
#   scgcad-map       cells are positions in another map (`indirect`).
#   snes-stamp-table-column   a stamp source table stored column-major.

id = "preset.tilemap.example-packed"  # unique and stable; never shown
name = "Example packed cell (16-bit)"  # shown in the format picker
engine_id = "codec.tilemap.packed"

[params]

# Bit layout of the assembled cell: one letter per bit, most significant first.
# Letters are case-insensitive; whitespace and `|` are separators.
#
#   i  tile index                 p  palette row
#   h  horizontal flip            v  vertical flip
#   o  priority (stored, not rendered)
#   d  drawn: the position is drawn only when set
#   e  ends the line (text formats; shown as a newline in View > Text)
#   f  flags: bits with no meaning to celPix, preserved on write
#   .  unused bit, written as zero (`-`, `0` and `x` also accepted)
#
# Every bit must have a letter, and the bit count must be a whole number of
# bytes. A field split into several runs is written where it sits; the runs join
# most significant first. A letter not used is a field the format lacks: the
# matching cell control is not offered.
fields = "vhop ppii iiii iiii"

# Optional: rename letters. Key: one character. Value: index, palette,
# priority, flip_h, flip_v, drawn, terminator or flags.
#   [params.legend]
#   t = "index"

# Cell width in bytes. Default: the layout's width. If given, it must match.
bytes = 2

# Order of the cell's bytes in the file: "little" (default) or "big". Any
# other value is an error.
# Independent of `fields`, which always describes the assembled word.
endian = "little"

# Tiles one cell draws, [across, down]. Default [1, 1]. [2, 2] is a cell that
# is a 16x16 metatile. A map storing a metatile as four adjacent cells is [1, 1].
# Bound to another map instead of a tile bank, a cell draws a stamp of that
# map's cells: one entry per stamp, its index the stamp's top-left cell. An index
# that counts stamps rather than naming a cell: index_addressing below.
# cell_tiles = [1, 1]

# Tile-row stride inside a metatile cell (cell_tiles above [1, 1]): the distance
# in the tile bank from a cell's upper tiles to its lower ones. Default 16, a
# console VRAM row. A table of consecutive tiles n, n+1, n+2, n+3 uses 2.
# Over a tile bank only: bound to another map, a cell draws a stamp of that
# map's cells laid out as the source lays them out -- its stamp_stride, else
# its width.
# cell_row_stride = 2

# Tile-column stride inside a metatile cell: the distance in the tile bank from
# a cell's left tiles to its right ones. Default 1, the next tile across. A cell
# filled down each column -- consecutive tiles n, n+1 on the left, n+2, n+3 on
# the right, the order some sprite writers place a 16x16 object in -- is
# cell_row_stride = 1 with cell_column_stride = 2. Over a tile bank only; a
# column-ordered stamp over another map is that map's stamp_order.
# cell_column_stride = 2

# Page geometry fixed by the hardware. Applied only when all three are set and
# the cell count is a whole number of pages listed in page_counts; otherwise the
# map keeps the width the view gives it. Ignored when the container states the
# page size.
# page_columns = 32
# page_rows = 32
# page_counts = [1, 2, 4]

# Cells run down each column instead of across each row. Display only: the file
# order is unchanged. Default false.
# column_major = true

# Palette row that a cell's row 0 means. Default 0. The entry, the container
# and the bound tile bank can each override it.
# palette_row_base = 4

# "text": cells are character codes. Adds View > Text; the codes are defined in
# the Font Alphabet window against the bound sheet. Default: a plain grid.
# layout = "text"

# ---- Bits kept outside the cell ----

# Some formats keep part of a cell in a second array: a metatile table's
# palette rows in a byte per metatile after its tile numbers, or a map's
# attributes in an array beside its tile array. `side_fields` is the layout of
# one word of that array, in the letters above; its bits sit above the cell's
# own, so an index split between the two joins as one field (side high bits
# first). Stating it adds a "Side array" input to the entry: bind it to the
# array in the Inputs window. The array is read-only: side bits follow it
# after every edit, and a field kept wholly in it is not offered for editing.
# side_fields = "......pp"

# Consecutive cells one side word covers. Default 1. 4 for one byte per 2x2
# metatile record.
# side_cells = 4

# ---- Maps that reference another map (tilemap-entry.md sec 3.1) ----

# Cells are coordinates into another map, not tile numbers. A hint: it changes
# the bind prompt and labels the base control "Base cell" before anything is
# bound; binding map to map works without it. Default false.
# indirect = true

# With `indirect`: what the bind dialog calls the source. Default "Tilemap".
# source_hint = "PNL panel"

# Source cells one coordinate names (the stamp), [across, down]. Default:
# cell_tiles where it is above [1, 1], else the size the source publishes, else
# [1, 1].
# stamp_cells = [2, 2]

# The file holds one entry per stamp rather than one per drawn position.
# Default false; always true where cell_tiles sets the stamp. Matters only where
# the stamp is larger than 1x1; a wrong value draws the map at four times or a
# quarter of its size.
# stamp_dense = true

# "corner" (default) or "ordinal": whether the index is the first cell (or
# tile) of the unit it draws, or counts the units -- stamp k of a table of 2x2
# stamps is cell 4k, not cell k. The cell holds the number as the file stores
# it. The units' layout comes from what the map is bound to: a table's
# stamp_stride and record_shape (below), or a tile bank's cell_tiles and
# cell_row_stride (above). A byte `vhii iiii` numbering the 16x16s of a
# 16-tile-wide VRAM image is ordinal with cell_tiles = [2, 2]: unit 1 is two
# tiles right of unit 0, unit 8 two tile rows down.
# index_addressing = "ordinal"

# ---- Tables other maps stamp from ----
#
# Read by celPix from the preset, whatever its engine, so a table in the middle
# of a chain (an _indirect-record.toml map another map draws through) takes
# the same parameters.

# Cells of this table one coordinate of a map bound to it names, [across,
# down]. Default: stamp_cells (above). State it only when the table offers a
# different stamp than it draws: a chunk of 8x8 cells, each drawing a 2x2 stamp
# of the table below it, offers [8, 8].
# offered_stamp_cells = [2, 2]

# Distance in this table's cells between a stamp's rows, for records stored end
# to end: a 2x2 stamp stored as four consecutive cells uses 2. Default: the
# width the table is shown at.
# stamp_stride = 2

# "row" (default) or "column": a stamp's cells stored across rows (TL TR BL BR)
# or down columns (TL BL TR BR). "column" requires stamp_stride.
# stamp_order = "row"

# Draw the table as fixed records, [across, down], instead of one continuous
# grid. Default: the offered stamp, when stamp_stride equals its side. Not
# applied to a paged, column-major or chained map, or when the cell count is not
# a whole number of records. record_order: "row" (default) or "column".
# record_shape = [2, 4]
# record_order = "row"
