# Example tilemap preset — a packed cell word.
#
# Copy this file, drop the leading underscore, edit it, and press F5 in celPix.
#
# A tilemap is a file of *references*: each cell names a tile that lives
# somewhere else (a tile bank you bind the map to) plus how to draw it. Nearly
# every hardware map stores a cell as one little- or big-endian integer with the
# tile number in the low bits and attributes above it, so a new map format is
# normally this file with the layout redrawn and no code at all.
#
# WHICH ENGINE IS WHICH
# ---------------------
# This is the grid engine: cells in rows, one packed integer each. The other four
# are sprite engines — records at signed pixel offsets, grouped into frames:
#
#   _object.toml     a packed sprite word; a size *bit* picks one of two sizes
#   _obz.toml        one field per byte, a wider character number, X first
#   _md-sprite.toml  a size *nibble* stating a rectangle, tiles down columns
#   _ys-spr.toml     frames of different lengths, counted by the container
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
# Most of them: every console BG entry is this engine with the layout redrawn.
# The ones worth reading next to this file:
#   snes-bg         the layout below, `vhop ppii iiii iiii`, with page geometry.
#   snes-bg-swapped the same fields, word stored the other way round.
#   gb-bg           a bare index byte, `iiii iiii`: every letter but `i` unused.
#   gba-bg          the same 16-bit shape with 32x32 pages.
#   text-8bit       character codes — gb-bg's byte, made a fontmap by `layout`.
#   text-16bit      the same at word width, for a font past 256 glyphs.
#   text-8bit-flag  `eiii iiii`: the line break as a flag above a 7-bit index.
#   snes-bg-16x16   the same word, cell drawing a 16x16 metatile.
#   scgcad-map      cells naming positions in another map (`indirect`).
#   scgcad-std      the plain screen of the same family.

id = "preset.tilemap.example-packed"
name = "Example packed cell (16-bit)"
engine_id = "codec.tilemap.packed"

[params]
# WHERE EACH FIELD SITS: one letter per bit, most significant first — the diagram
# your format's own documentation draws. Whitespace only groups it for counting.
#
#   i  which tile — the only field a map really needs
#   p  which palette row the cell draws through
#   o  priority; carried, never rendered, celPix has no layers
#   h  flip horizontally          v  flip vertically
#   d  this position IS drawn (leave it out unless your format has an enable bit)
#   e  this cell ends the line; see below
#   f  bits celPix has no meaning for, carried through so a write stays byte-exact
#   .  a bit no field claims, and one a write leaves clear
#
# Every bit gets a letter: a bit nobody names is written back as ZERO, and `.` is
# you saying so. The layout is checked against the cell width, so a short diagram
# is a load error rather than a map that quietly loses a bit on the first edit. A
# letter you never use is a field your format has not got.
#
# The layout below is the SNES BG entry, `vhopppcc tttttttt`:
fields = "vhop ppii iiii iiii"

# A field need not be contiguous: hardware that grew a tile number past the room
# left for it parks the extra bits wherever there was space. Write it where it is
# and the runs are one field, in the order they are read — a Game Boy Color index
# is `fields = "ovh. ippp iiii iiii"`.

# `e` is for a TEXT format that ends a line by setting a bit on its last character
# instead of spending a code on a terminator. It changes no pixel: it becomes the
# newline View > Text shows. Placing it also takes that bit OUT of the index, so
# `fields = "eiii iiii"` draws the letter the hardware draws rather than a tile
# past the end of the sheet.

# Cell width in bytes. Optional — the layout says — but checked against it.
bytes = 2

# "little" or "big": the order the cell's BYTES sit in, per *format* rather than
# per family. The layout is always the assembled word, high bit first, so the two
# are independent.
endian = "little"

# A format that spells a field some other way can keep its letters:
#
#   [params.legend]
#   c = "index"   # `c` and `t` in `vhopppcc tttttttt` are both the tile number
#   t = "index"

# How many tiles one cell draws, [across, down]. Default [1, 1]. Use [2, 2] for a
# cell that *is* a 16x16 metatile — but check first: a map storing all four tiles
# as four adjacent cells is 1x1, and reading it as 2x2 draws every metatile four
# times over.
# cell_tiles = [1, 1]

# Page geometry the FORMAT fixes, for hardware that cuts a map into screens of a
# set size. State all three or none: page width, page height, and the whole-page
# counts the hardware produces. `page_counts` keeps this from claiming maps the
# hardware never made — any other run of cells keeps the width you gave it.
# page_columns = 32
# page_rows = 32
# page_counts = [1, 2, 4]

# Set when a cell names a position in *another map* rather than a tile. A hint,
# not a gate: binding map-to-map works regardless, but it offers maps ahead of
# tile banks and drops the Base tile a coordinate cannot use. Editing such a map
# *restamps* — a cell's index picks a different cell from the map it draws
# through. Rare; scgcad-map is the only shipped preset that needs it.
# indirect = true

# Set when the cells are **character codes** rather than tile numbers. The picture
# is unchanged; what this adds is View > Text, where the run reads and is typed as
# words. Bind the entry to the font, tick that sheet **Use as Font**, and type its
# alphabet into the Font Alphabet window (docs/design/fontmap-entry.md).
#
# There are no control codes here, deliberately: what a value *means* is the
# font's answer, not the format's. So two streams punctuated differently over one
# font are two font *entries*, not two presets, and this preset stays reusable by
# every game with these bits. Name only what changes how the text reads — an
# unnamed code shows as `[$FF]` and types back to the same byte.
# layout = "text"
