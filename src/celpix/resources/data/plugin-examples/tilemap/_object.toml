# Example tilemap preset — sprite object subsprites, a map with no grid.
#
# Copy this file, drop the leading underscore, edit it, and press F5 in celPix.
#
# A sprite engine: its cells are not laid out in rows. Each record carries a
# *signed pixel offset* from an object's origin, so the view draws frames of
# freely placed subsprites — a sprite sheet, one frame after another. Reach for
# it only if your format is shaped the same way: fixed-size subsprite records, a
# fixed number of them per frame, each with its own x/y.
#
# WHICH ENGINE IS WHICH
# ---------------------
# This is the packed-sprite-word engine: the record is the console's own sprite
# attribute word, and a size *bit* in it picks one of two square sizes. The other
# three differ only in the record — _obz.toml (one field per byte, a wider
# character number, X first), _md-sprite.toml (a size *nibble* stating a
# rectangle, tiles down columns) and _ys-spr.toml (frames of different lengths,
# counted by the container). Anything laid out in rows wants _packed.toml.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   scgcad-object   the only one shipped on it — the record is fixed, so the
#                   values below are the whole of what varies.

id = "preset.tilemap.example-object"
name = "Example sprite object subsprite"
engine_id = "codec.tilemap.scgcad-object"

[params]
# A **sprite map**: cells are freely-placed subsprites grouped into frames rather
# than positions in a grid. Required — an object read without it is laid out as
# a grid of cells.
layout = "sprite"

# Byte order of the record's attribute word. A container that knows better can
# override it per *file* — the shipped sprite format has two builds that
# disagree, each saying which it is in its own header.
endian = "big"

# How many subsprite records make one frame. The payload is cut into frames of
# this size, so it decides how the sheet is divided as much as how it is drawn.
subsprites_per_frame = 64

# The two sizes a subsprite's own size bit chooses between, each a square that
# many tiles on a side. The file does not record the pair — the game set it in a
# register — so this is a stated assumption you can change rather than something
# read from the bytes. `[1, 2]` is one tile, or two by two.
subsprite_tiles = [1, 2]
