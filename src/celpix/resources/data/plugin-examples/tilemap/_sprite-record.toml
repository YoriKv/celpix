# Example preset: `codec.tilemap.sprite-record` — sprite parts as fixed records.
#
# To use: copy, remove the leading "_", edit, press F5. See _packed.toml for
# what a preset is.
#
# ENGINE
#   A sprite map: parts placed at signed pixel offsets and grouped into frames,
#   not cells in rows. This engine reads any record whose fields sit at fixed
#   byte positions, stored back to back or as parallel arrays. A frame reached
#   through pointers needs a code format (_example.py). Sprite maps open
#   read-only in the app.
#
#   The record below is 10 bytes: x.w  x_mirror.w  y.w  pad.b  size.b  attr.w
#
# SHIPPED PRESETS ON THIS ENGINE
#   nes-oam   the NES sprite list: Y, tile, attributes, X. palette_row_base 4.

id = "preset.tilemap.example-sprite-record"
name = "Example sprite record"
engine_id = "codec.tilemap.sprite-record"

[params]

# Required on this engine: cells are sprite parts, and each part states its own
# size (the c/r bits), so the toolbar offers no size pair.
layout = "sprite"
subsprite_size = "stated"

# A part's tiles run down each column before the next. Default false (across
# each row).
column_major = true

# Byte order of every multi-byte field and of the frame count: "big" (default)
# or "little". Any other value is an error.
endian = "big"

# Required. The fields in file order. `type`: u8, s8, u16, s16, u32 or s32.
# Fields named `x` and `y` are the part's offset from the frame origin; absent
# reads as 0. `bits` splits a field by a bit layout, most significant first:
#
#   i  tile index        p  palette row      o  priority
#   h  horizontal flip   v  vertical flip
#   c  width in tiles - 1                    r  height in tiles - 1
#   .  unused bit
#
# No c/r bits: every part is 1x1. All other fields, and `.` bits, are preserved
# byte for byte on write. Maximum record size: 64 bytes.
record = [
  { name = "x",        type = "s16" },
  { name = "x_mirror", type = "s16" },
  { name = "y",        type = "s16" },
  { name = "pad",      type = "u8" },
  { name = "size",     type = "u8",  bits = "....ccrr" },
  { name = "attr",     type = "u16", bits = "oppv hiii iiii iiii" },
]

# Optional: rename bit letters. Key: one character. Value: index, palette,
# priority, flip_h, flip_v, columns or rows.
#   [params.legend]
#   t = "index"

# Frames back to back, each preceded by a `bytes`-byte header holding its part
# count at offset `count_at` (default 0) as `count_type` (default "u16"). The
# other header bytes are preserved; the count is rewritten on encode. A count
# of 0, or one running past the data, is an error. Default: no header, and the
# whole run is one frame.
# frame_header = { bytes = 6, count_at = 4, count_type = "u16" }

# Fields stored as parallel arrays, each `count` elements long, instead of
# records back to back. Requires frame_header. The groups must list every
# record field once, in order. The Master System sprite table (every Y, then
# every X/tile pair):
#   record = [
#     { name = "y",    type = "s8" },
#     { name = "x",    type = "s8" },
#     { name = "tile", type = "u8", bits = "iiiiiiii" },
#   ]
#   arrays = [["y"], ["x", "tile"]]

# Palette row that a part's row 0 means. Default 0.
# palette_row_base = 4

# The Mega Drive VDP record on this engine (compare _md-sprite.toml):
#   record = [
#     { name = "y",        type = "s8" },
#     { name = "size",     type = "u8",  bits = "....ccrr" },
#     { name = "attr",     type = "u16", bits = "oppv hiii iiii iiii" },
#     { name = "x",        type = "s8" },
#     { name = "x_mirror", type = "s8" },
#   ]
