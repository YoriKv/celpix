# Example tilemap preset — sprite-pattern subsprites, the counted-frame record.
#
# Copy this file, drop the leading underscore, edit it, and press F5 in celPix.
#
# A sprite engine: frames of subsprites at signed pixel offsets rather than cells
# in rows.
#
# WHICH ENGINE IS WHICH
# ---------------------
# This is the counted-frame engine, the only one whose frames are **different
# lengths**. There is no drawn bit — a record that is present is drawn — and how
# many each frame holds is a count byte the *container* reads ahead of the
# records and states on the context. Hence no `subsprites_per_frame` below:
# nothing here could say where a frame ends. Point it at bytes that arrived
# through some other container and it falls back to fixed slots, which is a
# fallback and not a feature; a format that frames its subsprites some fixed way
# wants _object.toml or _obz.toml.
#
# The record layout is not configurable either: 8 bytes, X and Y as signed 16-bit
# pairs, a 16-bit character number, then the console's attribute byte and the size
# bit. A format that differs wants this engine's code copied. See _object.toml for
# the sprite engines' shared parameters; anything in rows wants _packed.toml.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   ys-spr          the sprite-pattern format this engine exists for, and the
#                   only one shipped on it.

id = "preset.tilemap.example-ys-spr"
name = "Example sprite pattern subsprite"
engine_id = "codec.tilemap.ys-spr"

[params]
# Cells are freely-placed subsprites grouped into frames (tilemap-entry.md sec 6).
layout = "sprite"

# Which palette row a cell's row 0 means. A sprite's 3-bit field counts from CGRAM
# row 8, so without this a pattern draws through the background's colours — not a
# wrong shade but the wrong palette.
palette_row_base = 8

# The two sizes the record's size bit chooses between, in tiles a side. Stated
# rather than read: the file does not record the pair.
subsprite_tiles = [1, 2]
