# Example preset: `codec.tilemap.md-sprite` — the Mega Drive VDP sprite record.
#
# To use: copy, remove the leading "_", edit, press F5. See _packed.toml for
# what a preset is.
#
# ENGINE
#   A sprite map: parts placed at signed pixel offsets, drawn as one frame per
#   entry. Record layout:
#
#       y.b  size.b  attr.w  x (1 or 2 bytes)  [x_mirror.b]
#
#   size   `....ccrr`: width and height in tiles, each minus 1 (1x1 to 4x4).
#          A part's tiles run down each column.
#   attr   `oppv hiii iiii iiii`: priority, palette row, flips, 11-bit tile.
#
#   There is no frame header: the entry must start at the first record. For any
#   other field order use _sprite-record.toml. Sprite maps open read-only in
#   the app.
#
# SHIPPED PRESETS ON THIS ENGINE
#   md-sprite   the same params as below.

id = "preset.tilemap.example-md-sprite"
name = "Example rectangular sprite object"
engine_id = "codec.tilemap.md-sprite"

[params]

# Required on this engine: cells are sprite parts, and each part states its own
# size, so the toolbar offers no size pair.
layout = "sprite"
subsprite_size = "stated"

# Width of X in bytes: 1 (default, signed byte) or 2 (signed big-endian word).
# Any other value is an error.
x_bytes = 1

# A trailing signed byte holds the X used when the object is drawn mirrored:
# -(x + width_in_pixels). Default true.
#
# x_bytes = 1 with mirror_x = true and x_bytes = 2 with mirror_x = false are
# both six bytes, and the wrong choice draws the parts in the wrong places
# without failing. With mirror_x set, each mirror byte is checked against its X
# and a mismatch raises a notice on the entry: try the other pair.
mirror_x = true

# Byte order of the attribute word: "big" (default) or "little".
endian = "big"

# Palette row that a part's row 0 means. Default 0.
# palette_row_base = 0
