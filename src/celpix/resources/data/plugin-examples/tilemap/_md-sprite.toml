# Example tilemap preset — a sprite object whose parts are rectangles.
#
# Copy this file, drop the leading underscore, edit it, and press F5 in celPix.
#
# A sprite engine: frames of parts at signed pixel offsets rather than cells in
# rows.
#
# WHICH ENGINE IS WHICH
# ---------------------
# This is the stated-rectangle engine, for a record that names a **rectangle**
# instead of picking between two squares. Its size byte is the Mega Drive VDP's
# own nibble, so one record covers anything from one tile to a 4x4 block, and the
# record's tiles run *down each column*. See _object.toml for the sprite engines'
# shared parameters and the other three records; anything in rows wants
# _packed.toml.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   md-sprite       the Mega Drive sprite list this engine exists for, and the
#                   only one shipped on it.

id = "preset.tilemap.example-md-sprite"
name = "Example rectangular sprite object"
engine_id = "codec.tilemap.md-sprite"

[params]
# Cells are freely-placed parts grouped into frames (tilemap-entry.md sec 6).
layout = "sprite"

# ...and records that **state** each part's rectangle, rather than choosing
# between two squares. The alternative is to leave this out and give
# `subsprite_tiles` the pair, as _object.toml does.
subsprite_size = "stated"

# The X offset's width in bytes. 1 is a signed byte; 2 is a signed word.
x_bytes = 1

# Whether a trailing byte holds the X the part takes when the object is drawn
# mirrored — always -(x + width_in_pixels).
#
# This pair is the one thing to get right, and the one that fails quietly: a
# record with a byte X *and* a mirror byte is the same six bytes as one with a
# signed word X, so the wrong choice draws a plausible object with its pieces in
# the wrong places. celPix checks the mirror field against the X it should be and
# says so in the status notices — if a run comes out strewn across the canvas,
# swap these two.
mirror_x = true

# Byte order of the record's attribute word — the 11-bit tile, both flips, the
# palette row and the priority bit.
endian = "big"
