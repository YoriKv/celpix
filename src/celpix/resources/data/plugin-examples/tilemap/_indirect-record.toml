# Example preset: `codec.tilemap.indirect-record` — a byte names a metatile record.
#
# To use: copy, remove the leading "_", edit, press F5. See _packed.toml for
# what a preset is.
#
# ENGINE
#   A level map of one byte per metatile. Each byte is the number of a record in
#   a definition table (another tilemap entry, bound as this map's source) that
#   holds the metatile's tile numbers. The engine converts the record number to
#   the record's first cell in the table on decode, and back on encode, so the
#   map draws as a dense chain of stamps (tilemap-entry.md sec 3.1). A map whose
#   cells already hold cell positions uses _packed.toml with `indirect`.
#
#   The format has no flips and no writable palette row. Sample projects with
#   their own preset on this engine: alex-kidd, smw, smb, ferias-frustradas,
#   ferias-frustradas-sms.
#
# SHIPPED PRESETS ON THIS ENGINE
#   metatile-index   the params below: 2x2 records stored end to end.

id = "preset.tilemap.example-indirect-record"
name = "Example indirect record map (byte -> metatile record)"
engine_id = "codec.tilemap.indirect-record"

[params]

# Cells per record. Default 4. With records stored end to end, record k starts
# at cell k * record_cells.
record_cells = 4

# For a table laid out as a grid N records across (0, the default: end to end).
# Record k then starts at
#   (k // N) * N * record_cells + (k % N) * record_columns
# record_columns (default 2) is the record's width in cells.
records_across = 0
record_columns = 2

# Read by the host, not the engine. `indirect`: cells are coordinates into
# another map. `stamp_cells`: source cells one coordinate names, [across, down].
# `stamp_dense`: one entry per stamp. `column_major`: the map is stored down
# each column (display only).
indirect = true
stamp_cells = [2, 2]
stamp_dense = true
column_major = false

# Several tables end to end, selected by the byte's top bits. `group_bits`
# (1-7; default 0, off): how many top bits select the table; the rest are the
# record within it. `group_starts`: each table's first record, 2^group_bits
# ascending values. `group_rows` (default false): the table number is the
# cell's palette row. Super Mario Bros.: two bits, tables of 39, 46, 10 and 6.
# group_bits = 2
# group_starts = [0, 39, 85, 95]
# group_rows = true
