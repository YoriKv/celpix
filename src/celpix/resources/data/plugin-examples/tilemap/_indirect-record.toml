# Example tilemap preset — a map whose byte names a record of a definition table.
#
# Copy this file, drop the leading underscore, edit it, and press F5 in celPix.
#
# WHICH ENGINE IS WHICH
# ---------------------
# This is the indirect-record engine, for the level-map shape a side-scroller
# keeps: one byte per 16x16 metatile, no filler, each byte the *number* of a
# record in a metatile table that holds four tile numbers apiece. celPix draws
# such a map as a dense stamped chain (tilemap-entry.md sec 3.1) and resolves a
# stamp from a source *cell*, so the engine turns the record number into the
# record's first cell on the way in and back into the number on the way out.
# A map whose cells already hold cell positions wants _packed.toml.
#
# SHIPPED PRESETS BUILT ON IT
# ---------------------------
#   metatile-index  one byte per 2x2 record of a packed, two-cell-wide table -
#                   the ordinary side-scroller map. A game's own geometry (a
#                   grid-laid table, a column-major file) is a project preset
#                   like this one: Alex Kidd's level maps, Melroon's area maps
#                   and Super Mario World's Map16 index maps are the three in
#                   the sample projects.

id = "preset.tilemap.example-indirect-record"
name = "Example indirect record map (byte -> metatile record)"
engine_id = "codec.tilemap.indirect-record"

[params]
# Cells per record: four for a 2x2 metatile of a two-cell-wide table, so
# record k's first cell is 4k. This is the packed case (records end to end);
# `records_across = 0` says so.
record_cells = 4
records_across = 0
# Only read for a table a reshape has laid out as a grid N records across,
# where a record's corner is (k // N) * N * record_cells + (k % N) * this.
record_columns = 2

# The chain's own declarations, read by the host rather than the engine
# (tilemap-entry.md sec 3.1): the cells are coordinates into another map, one
# entry per stamp with no filler, and - for a map stored down each column, as
# a stream cut one part per row comes out - column-major.
indirect = true
stamp_cells = [2, 2]
stamp_dense = true
column_major = false
