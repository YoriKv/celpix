# Example preset: `codec.tilemap.indirect-record` — a byte names a metatile record.
#
# To use: copy, remove the leading "_", edit, press F5. See _packed.toml for
# what a preset is.
#
# ENGINE
#   A level map of one byte per metatile. Each byte is the number of a record in
#   a definition table (another tilemap entry, bound as this map's source) that
#   holds the metatile's tile numbers. The cell keeps the record number; celPix
#   finds the record's first cell in the table from the record keys below, so
#   the map draws as a dense chain of stamps (tilemap-entry.md sec 3.1). A map
#   whose cells already hold cell positions uses _packed.toml with `indirect`.
#
#   The format has no flips and no writable palette row: a record number sharing
#   its cell with flips is _packed.toml with index_addressing = "ordinal". Sample
#   projects with their own preset on this engine: alex-kidd, smw, smb, ff2,
#   phantasy-star-2-3, ferias-frustradas, ferias-frustradas-sms.
#
# SHIPPED PRESETS ON THIS ENGINE
#   metatile-index   the params below: 2x2 records stored end to end.

id = "preset.tilemap.example-indirect-record"
name = "Example indirect record map (byte -> metatile record)"
engine_id = "codec.tilemap.indirect-record"

[params]

# The record keys: the table's shape, which celPix reads to find record k's
# first cell. Read on this engine only, since its byte is always a record
# number; each is at its default where left out. A preset stating
# index_addressing = "ordinal" and none of them takes the shape from the table
# it is bound to instead (its stamp_stride, record_shape and record_header,
# _packed.toml). The binding's base counts records too: base 64 starts the map
# at record 64.
#
# Cells per record. Default 4. With records stored end to end, record k starts
# at cell k * record_cells.
record_cells = 4

# For a table laid out as a grid N records to a row (0, the default: end to
# end). Record k then starts at
#   (k // N) * N * record_cells + (k % N) * record_width
# record_width (default 2) is the record's width in cells.
records_per_row = 0
record_width = 2

# Cells at the start of each record that come before what it draws (default 0)
# -- a record opening with a word of its own. Record k's first drawn cell moves
# that many cells in; on a grid, whole rows of record_width. A plain count,
# nothing read out of it. A table can state it of its own records instead
# (_packed.toml), for a preset here that takes its shape from the table.
record_header = 0

# Read by the host, not the engine. `indirect`: cells are coordinates into
# another map. `stamp_cells`: source cells one coordinate names, [across, down].
# `stamp_dense`: one entry per stamp. `column_major`: the map is stored down
# each column (display only).
indirect = true
stamp_cells = [2, 2]
stamp_dense = true
column_major = false

# Several tables end to end, selected by the byte's top bits. `group_bits`
# (1-7; default 0, off): how many top bits select the table; the rest are the
# record within it. `group_starts`: each table's first record, 2^group_bits
# ascending values. `group_rows` (default false): the table number is the
# cell's palette row. Super Mario Bros.: two bits, tables of 39, 46, 10 and 6.
# Each table reaches 2^(8 - group_bits) records from its start. A record no
# table reaches - below the first start, or between one table's reach and the
# next start - is not offered and cannot be placed or saved.
# group_bits = 2
# group_starts = [0, 39, 85, 95]
# group_rows = true

# ---- As a table another map draws through ----
#
# A map read here can itself be the table a map above stamps from: a table of
# 2x2 stamps whose bytes name metatile records, drawn by a town map one stamp
# per byte. Say what it offers that map with the table parameters of
# _packed.toml, which celPix reads for any engine: `stamp_stride`,
# `stamp_order`, `offered_stamp_cells` (default: stamp_cells above).
# `record_shape` and `record_order` are read too, but do nothing here: a map
# drawn through a source is never laid out in records. Final Fantasy II's
# field maps draw through such a table: four cells per stamp, packed end to end.
# stamp_stride = 2
