name: CI

# Lint only. The test suite runs locally before every change; running it here
# across an OS matrix burned Actions credits — macOS bills at 10x and Windows
# at 2x — for failures the local runs already catch.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Ruff lint/format are advisory: they report issues but never fail the
      # build, so a style nit can't block a release. continue-on-error still runs
      # the step and surfaces its output/annotations, just without a hard fail.
      - name: Lint
        run: uv run ruff check .
        continue-on-error: true

      - name: Format check
        run: uv run ruff format --check .
        continue-on-error: true
